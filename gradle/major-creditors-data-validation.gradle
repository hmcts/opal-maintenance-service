import java.util.concurrent.TimeUnit
import org.gradle.api.GradleException

ext.verifyMajorCreditorsCandidate = { Map context ->
  File rootDirectory = context.rootDirectory as File
  String containerName = context.containerName.toString()
  String databaseName = context.databaseName.toString()
  String quotedDatabase = '"' + databaseName.replace('"', '""') + '"'
  File reportFile = context.reportFile as File
  def runCommand = context.runCommand
  def sessions = []
  Throwable primaryFailure = null
  reportFile.text = ''

  def check = { boolean condition, String message ->
    reportFile.append((condition ? 'PASS: ' : 'FAIL: ') + message + '\n', 'UTF-8')
    if (!condition) {
      throw new GradleException(message)
    }
  }
  def run = { List command, boolean required = true ->
    def result = runCommand(command.collect { it.toString() })
    if (required && result.exitCode != 0) {
      throw new GradleException(result.stdout + result.stderr)
    }
    result
  }
  def psqlCommand = { String database, String application = null ->
    def command = ['docker', 'exec', '-i']
    if (application != null) {
      command += ['--env', 'PGAPPNAME=' + application]
    }
    command + [containerName, 'psql', '-X', '-qAt', '-v', 'ON_ERROR_STOP=1',
               '-v', 'VERBOSITY=verbose', '-U', 'postgres', '-d', database]
  }
  def sql = { String statement, String database = databaseName, boolean required = true ->
    run(psqlCommand(database) + ['-c', statement], required)
  }
  def scalar = { String statement -> sql(statement).stdout.trim() }
  def flyway = { List arguments, boolean required = true ->
    run(context.flywayBaseCommand + arguments, required)
  }
  def history = {
    scalar('SELECT script FROM public.flyway_schema_history WHERE success ORDER BY installed_rank;')
      .readLines()
  }
  def snapshot = {
    [major_creditors: 'major_creditor_id', countries: 'country_id',
     business_units: 'business_unit_id', flyway_schema_history: 'installed_rank'].collect { table, key ->
      scalar("SELECT coalesce(jsonb_agg(to_jsonb(t) ORDER BY ${key}), '[]'::jsonb) FROM public.${table} t;")
    }
  }
  def reset = {
    // Separate commands: DROP/CREATE DATABASE must not share an implicit transaction.
    sql("DROP DATABASE ${quotedDatabase};", 'postgres')
    sql("CREATE DATABASE ${quotedDatabase} TEMPLATE po10296_predecessor;", 'postgres')
  }
  def assertFailure = { Map result, String state, String diagnostic ->
    reportFile.append(result.stdout + result.stderr, 'UTF-8')
    check(result.exitCode != 0 && (result.stdout + result.stderr).contains(state)
      && (result.stdout + result.stderr).contains(diagnostic), 'expected failure: ' + diagnostic)
  }
  def noTargetLock = {
    check(scalar("SELECT count(*) FROM pg_locks WHERE relation='public.major_creditors'::regclass "
      + "AND mode='ShareRowExclusiveLock';") == '0', 'target lock released')
  }
  def startSession = { String application ->
    File output = new File(reportFile.parentFile, application + '.stdout.log')
    File error = new File(reportFile.parentFile, application + '.stderr.log')
    def process = new ProcessBuilder(psqlCommand(databaseName, application).collect { it.toString() })
      .directory(rootDirectory).redirectOutput(output).redirectError(error).start()
    def session = [process: process, output: output, error: error, consumedLines: 0]
    sessions.add(session)
    session
  }
  def send = { Map session, String text ->
    session.process.outputStream.write((text + '\n').getBytes('UTF-8'))
    session.process.outputStream.flush()
  }
  def marker = { Map session, String expected ->
    long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(15)
    while (System.nanoTime() < deadline) {
      def lines = session.output.readLines('UTF-8')
      int markerLine = lines.findIndexOf { it == expected }
      if (markerLine >= 0) {
        session.consumedLines = markerLine + 1
        return
      }
      if (!session.process.isAlive()) {
        throw new GradleException('Session exited before ' + expected + ': ' + session.error.getText('UTF-8'))
      }
      Thread.sleep(50)
    }
    throw new GradleException('Session marker timeout: ' + expected)
  }
  def finish = { Map session ->
    session.process.outputStream.close()
    if (!session.process.waitFor(25, TimeUnit.SECONDS)) {
      throw new GradleException('Concurrent SQL session timed out')
    }
    [exitCode: session.process.exitValue(),
     stdout: session.output.readLines('UTF-8').drop(session.consumedLines).join('\n'),
     stderr: session.error.getText('UTF-8')]
  }
  def waiting = { String application ->
    long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(10)
    while (System.nanoTime() < deadline) {
      if (scalar("SELECT count(*) FROM pg_stat_activity WHERE application_name='${application}' "
        + "AND wait_event_type='Lock';") == '1') {
        return
      }
      Thread.sleep(50)
    }
    throw new GradleException('Expected lock wait was not observed: ' + application)
  }
  def compareVersion = { List left, List right ->
    for (int index = 0; index < Math.min(left.size(), right.size()); index++) {
      int difference = left[index] <=> right[index]
      if (difference != 0) {
        return difference
      }
    }
    left.size() <=> right.size()
  }

  try {
    check(containerName.startsWith('opal-maintenance-db-unit-test-'), 'existing test-owned container selected')
    check(!databaseName.isBlank(), 'existing test-owned database name supplied')
    String candidate = 'V1_10__insert_major_creditors_reference_data.sql'
    String predecessor = 'V1_9__create_major_creditors_table.sql'
    File candidateFile = new File(rootDirectory, 'src/main/resources/db/migration/data/allEnvs/' + candidate)
    String seed = candidateFile.getText('UTF-8')
    def applySeed = { boolean required = true ->
      sql('BEGIN;\n' + seed + "\nSELECT to_regclass('pg_temp.temp_major_creditors_seed') IS NULL;\nCOMMIT;",
          databaseName, required)
    }
    def expectedFailure = { String setup, String state, String diagnostic ->
      reset()
      sql(setup)
      def before = snapshot()
      assertFailure(applySeed(false), state, diagnostic)
      check(snapshot() == before, 'failed candidate preserves data and Flyway history')
      noTargetLock()
    }
    def migrations = []
    context.migrationDirectories.each { File directory ->
      check(directory.isDirectory(), 'selected migration directory exists: ' + directory.name)
      directory.eachFileRecurse { File migration ->
        if (migration.isFile() && migration.name.startsWith('V') && migration.name.endsWith('.sql')) {
          def match = migration.name =~ /^V([0-9]+(?:_[0-9]+)*)__.+\.sql$/
          check(match.matches(), 'versioned migration name: ' + migration.name)
          migrations.add([version: match[0][1].split('_').collect { it.toInteger() }, name: migration.name])
        }
      }
    }
    check(migrations.collect { it.version.join('.') }.toSet().size() == migrations.size(), 'selected versions are unique')
    check(migrations.count { it.name == candidate } == 1, 'one candidate in selected locations')
    def prior = migrations.findAll { compareVersion(it.version, [1, 10]) < 0 }
      .sort { left, right -> compareVersion(left.version, right.version) }
    check(!prior.isEmpty() && prior.last().version == [1, 9] && prior.last().name == predecessor,
      'integrated V1.9 is required as immediate predecessor')
    reportFile.append('Candidate: ' + candidate + '; predecessor: 1.9; locations: ddl,allEnvs,dev\n', 'UTF-8')
    reportFile.append('Base: ' + run(['git', '-C', rootDirectory.absolutePath, 'rev-parse', 'HEAD']).stdout, 'UTF-8')

    // Fresh installation and the complete pgTAP suite have already passed in this container.
    // Rebuild only this disposable database to exercise the real predecessor upgrade.
    sql("DROP DATABASE ${quotedDatabase};", 'postgres')
    sql("CREATE DATABASE ${quotedDatabase};", 'postgres')
    flyway(['-target=1.9', 'migrate'])
    check(history() == prior.collect { it.name }, 'exact predecessor migration chain')
    check(scalar('SELECT count(*) FROM public.major_creditors;') == '0', 'predecessor has no seeded creditors')
    sql("CREATE DATABASE po10296_predecessor TEMPLATE ${quotedDatabase};", 'postgres')
    flyway(['-target=1.10', 'migrate'])
    check(history() == prior.collect { it.name } + [candidate], 'candidate applies after V1.9')
    flyway(['-target=1.10', 'validate'])
    def before = snapshot()
    flyway(['-target=1.10', 'migrate'])
    check(snapshot() == before, 'second Flyway migration is a no-op')
    def tap = run(['docker', 'exec', containerName, 'pg_prove', '--verbose', '-h', 'localhost',
      '-U', 'postgres', '-d', databaseName,
      '/tmp/opal-db-unit-test/majorCreditorsDataTest/major_creditors_data_pgtap_tests.sql'])
    reportFile.append(tap.stdout + tap.stderr, 'UTF-8')
    check(snapshot() == before, 'upgrade pgTAP scenarios roll back their fixture changes')
    def result = applySeed()
    check(result.stdout.trim() == 't' && snapshot() == before, 'direct rerun preserves IDs and drops staging')

    expectedFailure("INSERT INTO public.major_creditors "
      + "(business_unit_id,major_creditor_code,name,address_line_1,active,central_authority) "
      + "VALUES (44,'0001','PO10296 conflict','Test address',true,true);",
      'P0001', 'Existing Major Creditors differ')
    reset()
    applySeed()
    sql("UPDATE public.major_creditors SET contact_name='PO10296 test contact' "
      + "WHERE business_unit_id=44 AND major_creditor_code='0001';")
    before = snapshot()
    assertFailure(applySeed(false), 'P0001', 'Existing Major Creditors differ')
    check(snapshot() == before, 'NULL versus populated conflict leaves all rows unchanged')
    noTargetLock()
    expectedFailure("UPDATE public.countries SET country_name='PO10296 hidden Finland' WHERE country_name='Finland';",
      'P0001', 'No Country found')
    expectedFailure("INSERT INTO public.countries(cjs_code,country_name,date_used_from,active) "
      + "VALUES(32000,'Finland',DATE '2026-09-23',true);", 'P0001', 'Multiple Countries found')
    expectedFailure('DELETE FROM public.business_units WHERE business_unit_id=44;', '23503', 'mc_business_unit_id_fk')
    expectedFailure("ALTER TABLE public.major_creditors ADD CONSTRAINT po10296_reject_last "
      + "CHECK (major_creditor_code <> '0010');", '23514', 'po10296_reject_last')
    reset()
    sql("ALTER TABLE public.major_creditors ADD CONSTRAINT po10296_reject_last CHECK (major_creditor_code <> '0010');")
    before = snapshot()
    assertFailure(flyway(['-target=1.10', 'migrate'], false), '23514', 'po10296_reject_last')
    check(snapshot() == before, 'failed Flyway candidate leaves no partial data or successful history')
    noTargetLock()

    reset()
    def writer = startSession('po10296_earlier_writer')
    send(writer, "BEGIN; INSERT INTO public.major_creditors "
      + "(business_unit_id,major_creditor_code,name,address_line_1,active,central_authority) "
      + "VALUES(44,'0001','Earlier conflict','Test address',true,true); SELECT 'ready';")
    marker(writer, 'ready')
    def loader = startSession('po10296_waiting_seed')
    send(loader, "SET lock_timeout='15s'; BEGIN;\n" + seed + '\nCOMMIT;')
    waiting('po10296_waiting_seed')
    send(writer, 'COMMIT;')
    check(finish(writer).exitCode == 0, 'earlier writer commits')
    assertFailure(finish(loader), 'P0001', 'Existing Major Creditors differ')
    check(scalar('SELECT count(*) FROM public.major_creditors;') == '1', 'waiting seed inserts no partial rows')
    noTargetLock()

    int boundary = seed.indexOf('-- An existing business key')
    check(boundary > 0, 'candidate exposes the reviewed post-lock validation boundary')
    String prefix = seed.substring(0, boundary)
    String suffix = seed.substring(boundary)
    [true, false].each { boolean commit ->
      reset()
      loader = startSession('po10296_lock_holder')
      send(loader, 'BEGIN;\n' + prefix + "\nSELECT 'locked';")
      marker(loader, 'locked')
      check(scalar('SELECT count(*) FROM public.major_creditors;') == '0', 'ordinary reads remain available')
      writer = startSession('po10296_blocked_writer')
      send(writer, "SET lock_timeout='15s'; INSERT INTO public.major_creditors "
        + "(business_unit_id,major_creditor_code,name,address_line_1,active,central_authority) "
        + "VALUES(44,'0001','Later conflict','Test address',true,true);")
      waiting('po10296_blocked_writer')
      send(loader, commit
        ? suffix + "\nSELECT to_regclass('pg_temp.temp_major_creditors_seed') IS NULL; COMMIT;"
        : "ROLLBACK; SELECT to_regclass('pg_temp.temp_major_creditors_seed') IS NULL;")
      result = finish(loader)
      check(result.exitCode == 0 && result.stdout.trim() == 't', 'loader completes with staging cleanup: ' + commit)
      result = finish(writer)
      if (commit) {
        assertFailure(result, '23505', 'duplicate key')
        check(scalar('SELECT count(*) FROM public.major_creditors;') == '10', 'committed seed retains ten rows')
      } else {
        check(result.exitCode == 0, 'writer resumes after loader rollback')
        check(scalar('SELECT count(*) FROM public.major_creditors;') == '1', 'rollback leaves only the later writer')
      }
      noTargetLock()
    }
    reportFile.append('All candidate scenarios passed. Container cleanup is reported by dbUnitTest.\n', 'UTF-8')
  } catch (Throwable failure) {
    primaryFailure = failure
    reportFile.append('FAILED: ' + failure.message + '\n', 'UTF-8')
    throw failure
  } finally {
    Throwable clientCleanupFailure = null
    sessions.each { session ->
      if (session.process.isAlive()) {
        session.process.destroyForcibly()
        if (!session.process.waitFor(10, TimeUnit.SECONDS)) {
          clientCleanupFailure = new GradleException('Concurrent SQL client did not terminate')
        }
      }
    }
    if (clientCleanupFailure != null) {
      reportFile.append('FAILED: ' + clientCleanupFailure.message + '\n', 'UTF-8')
      if (primaryFailure != null) {
        primaryFailure.addSuppressed(clientCleanupFailure)
      } else {
        throw clientCleanupFailure
      }
    }
  }
}

        assert result.selected*.id == ['fixture.unchanged','fixture.other','fixture.appended']
        assert result.historyValidation.status == 'Comparison unavailable — HEAD immutability verified'
      }
      def archiveFixture = { boolean invalidGit ->
        def repository = Files.createTempDirectory('opal-selection-archive-').toFile()
        roots.add(repository)
        write(repository,'src/main/resources/db/migration/ddl/V1_1__archive.sql','archive candidate\n')
        write(repository,'src/dbUnitTest/archive_pgtap_tests.sql','archive assertions\n')
        if (invalidGit) { new File(repository,'.git').text='gitdir: missing.git\n' }
        [repo:repository, base:null, scenarios:[[id:'fixture.archive',candidate:'ddl/V1_1__archive.sql',
          owner:new File(repository,'src/dbUnitTest/archive_pgtap_tests.sql'),inputs:[]]]]

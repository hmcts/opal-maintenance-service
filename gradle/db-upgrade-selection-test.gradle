          assert result.fallbackReason
          assert result.frameworkTestsRequired
          assert result.historyValidation.headInventoryStatus == 'Unavailable'
          assert result.historyValidation.indexInventoryStatus == 'Unavailable'
          assert result.historyValidation.testedInventory*.path == ['ddl/V1_1__archive.sql']
        }
      }
      check('unavailable index retains verified HEAD and conservatively replays all') {
        def f = fixture()
        new File(f.repo,'.git/index').text='fixed corrupt index\n'
        def result = select(f,[comparisonRef:null])
        assert result.mode == 'full'
        assert result.selected*.id == ['fixture.unchanged','fixture.other']
        assert result.frameworkTestsRequired
        assert result.historyValidation.headInventoryStatus == 'Verified'
        assert result.historyValidation.indexInventoryStatus == 'Unavailable'
        assert result.historyValidation.headSha == f.base

      }
      check('HEAD migration deletion remains mandatory without comparison') {
        def f = fixture()
        write(f.repo,'src/main/resources/db/migration/ddl/V1_2__new.sql','new committed candidate\n'); commit(f)
        new File(f.repo,'src/main/resources/db/migration/ddl/V1_2__new.sql').delete()
        rejects { select(f,[comparisonRef:null]) }

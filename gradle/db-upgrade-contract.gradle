      customFile.delete()
      Files.createSymbolicLink(customFile.toPath(),manifest.toPath())
      fileRejects('live-leaf-symlink') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      Files.delete(customFile.toPath())
      Files.createSymbolicLink(customFile.toPath(),new File(temporary,'missing.sql').toPath())
      fileRejects('dangling-leaf-symlink') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      Files.delete(customFile.toPath()); customFile.parentFile.delete()
      def parent = customFile.parentFile.toPath()
      Files.createSymbolicLink(parent,new File(temporary,'src/dbUnitTest/support').toPath())
      fileRejects('live-parent-symlink') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      Files.delete(parent)
      Files.createSymbolicLink(parent,new File(temporary,'missing-directory').toPath())
      fileRejects('dangling-parent-symlink') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      Files.delete(parent)
      def ownerFile = new File(temporary,'src/dbUnitTest/declaring_owner.sql')
      ownerFile.parentFile.mkdirs(); ownerFile.text = 'declaring owner fixture\n'
      def otherOwner = new File(temporary,'src/dbUnitTest/other_owner.sql')
      otherOwner.text = 'other owner fixture\n'
      def ownerScenario = copyDeclaration(dataOwner) + [owner:ownerFile]
      correctionCheck('owner-token-validates-declaring-file') {
        assert project.ext.validateDbUpgradeContract(ownerScenario,temporary) == ownerScenario.contract
        assert project.ext.dbUpgradeContractCustomScripts(ownerScenario,temporary) == [verify:ownerFile]
        assert project.ext.dbUpgradeContractCustomScripts(ownerScenario,temporary).verify != otherOwner
        assert ownerScenario.contract.custom.verify == 'owner'
      }
      correctionReject('owner-token-missing-owner-field') {
        project.ext.validateDbUpgradeContract(copyDeclaration(dataOwner),temporary)
      }
      correctionReject('owner-token-requires-file-owner') {
        project.ext.validateDbUpgradeContract(copyDeclaration(dataOwner) + [owner:ownerFile.path],temporary)
      }
      def outsideOwner = new File(temporary,'outside_owner.sql')
      outsideOwner.text = 'outside database root fixture\n'
      def nonSqlOwner = new File(temporary,'src/dbUnitTest/not_sql.txt')
      nonSqlOwner.text = 'not SQL fixture\n'
      def directoryOwner = new File(temporary,'src/dbUnitTest/directory.sql')
      directoryOwner.mkdirs()
      [outside:outsideOwner, nonsql:nonSqlOwner, directory:directoryOwner,
       missing:new File(temporary,'src/dbUnitTest/missing_owner.sql'),
       noncanonical:new File(temporary,'src/dbUnitTest/../dbUnitTest/declaring_owner.sql')].each { name, owner ->
        correctionReject("invalid-owner-file-${name}") {
          project.ext.validateDbUpgradeContract(copyDeclaration(dataOwner) + [owner:owner],temporary)
        }
      }
      ['live','dangling'].each { kind ->
        def leaf = new File(temporary,"src/dbUnitTest/${kind}_owner.sql").toPath()
        Files.createSymbolicLink(leaf,kind == 'live' ? ownerFile.toPath() : new File(temporary,'absent.sql').toPath())
        correctionReject("owner-leaf-symlink-${kind}") {
          project.ext.validateDbUpgradeContract(copyDeclaration(dataOwner) + [owner:leaf.toFile()],temporary)
        }
        Files.delete(leaf)
        def ownerParent = new File(temporary,"src/dbUnitTest/${kind}_owner_directory").toPath()
        Files.createSymbolicLink(ownerParent,kind == 'live' ? ownerFile.parentFile.toPath() : new File(temporary,'absent-directory').toPath())
        correctionReject("owner-parent-symlink-${kind}") {
          project.ext.validateDbUpgradeContract(copyDeclaration(dataOwner) + [owner:ownerParent.resolve(ownerFile.name).toFile()],temporary)
        }
        Files.delete(ownerParent)
      }
      def pathVerifier = new File(temporary,'src/dbUnitTest/upgradeCases/data_owner_verify.sql')
      pathVerifier.parentFile.mkdirs(); pathVerifier.text = 'existing custom verifier fixture\n'
      correctionCheck('existing-custom-path-with-observe-resolves-unchanged') {
        def scenario = copyDeclaration(dataOwner)
        scenario.contract.custom.verify = 'src/dbUnitTest/upgradeCases/data_owner_verify.sql'
        assert project.ext.dbUpgradeContractCustomScripts(scenario,temporary) == [verify:pathVerifier]
      }
      def helper = new File(temporary,supportPaths[1]); helper.delete()
      fileRejects('missing-fixed-support') { project.ext.dbUpgradeSupportFiles(temporary) }
      Files.createSymbolicLink(helper.toPath(),manifest.toPath())
      fileRejects('symbolic-fixed-support') { project.ext.dbUpgradeSupportFiles(temporary) }
      Files.delete(helper.toPath())
    } finally { temporary.deleteDir() }
    if (!correctionFailures.isEmpty()) {
      throw new GradleException("Compact data contract regressions failed (${correctionFailures.size()}):\n" + correctionFailures.join('\n'))
    }
    logger.lifecycle("Contract metadata regressions: ${checks} passed")
  }
}

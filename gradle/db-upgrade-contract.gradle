import groovy.json.JsonOutput
import org.gradle.api.GradleException
import java.nio.file.Files

// Frankie Moran — PO-10643 — 15/10/2026
// Contracts supply values and identities; SQL support owns database assertions.
def contractPath = { Object value ->
  value instanceof String && value ==~ /[A-Za-z0-9_.\/-]+/ && !value.startsWith('/') &&
    !value.split('/', -1).any { it in ['', '.', '..'] }
}
def objectName = { Object value ->
  value instanceof String && value ==~ /[a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*/ &&
    !value.startsWith('pg_') && !value.startsWith('information_schema.') &&
    !value.startsWith('opal_test_upgrade_observation.') &&
    !value.startsWith('opal_db_unit_test_framework_state.')
}
def routineName = { Object value ->
  if (!(value instanceof String)) { return false }
  def match = value =~ /^([a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*)\((.*)\)$/
  if (!match.matches() || !objectName(match[0][1])) { return false }
  def arguments = match[0][2]
  arguments.isEmpty() || arguments.split(',', -1).every { type ->
    def scalar = type.endsWith('[]') ? type.substring(0,type.length()-2) : type
    scalar in ['bigint','integer','smallint','boolean','text','json','jsonb','character varying',
      'character','timestamp without time zone','timestamp with time zone','date','numeric',
      'real','double precision','uuid','bytea','time without time zone','time with time zone',
      'interval','bit','bit varying'] || objectName(scalar)
  }
}
def exactFields = { Object value, List required, List optional, String source ->
  if (!(value instanceof Map) || !value.keySet().containsAll(required) ||
      !(required + optional).containsAll(value.keySet())) {
    throw new GradleException("Unknown or missing contract field at ${source}")
  }
}
// This bounded JSON subset retains duplicate-key evidence before constructing maps.
// Strings are literal printable ASCII: no escapes, control bytes or scalar SQL fragments.
def constrainedJson = { String input, String source ->
  if (input == null || input.length() > 65536) { throw new GradleException("Oversized contract metadata at ${source}") }
  int position = 0, nodes = 0
  def fail = { throw new GradleException("Malformed contract metadata at ${source}") }
  def whitespace = { while (position < input.length() && input.charAt(position) in [' ' as char,'\t' as char,'\r' as char,'\n' as char]) { position++ } }
  def string = {
    if (position >= input.length() || input.charAt(position++) != '"' as char) { fail() }
    def result = new StringBuilder()
    while (position < input.length() && input.charAt(position) != '"' as char) {
      char next = input.charAt(position++)
      if (next < 32 || next > 126 || next == '\\' as char || result.length() >= 4096) { fail() }
      result.append(next)
    }
    if (position >= input.length()) { fail() }
    position++
    result.toString()
  }
  Closure value
  value = { int depth ->
    if (depth > 8 || ++nodes > 4096) { fail() }
    whitespace()
    if (position >= input.length()) { fail() }
    char next = input.charAt(position)
    if (next == '"' as char) { return string() }
    if (!(next in ['{' as char,'[' as char])) { fail() }
    boolean object = next == '{' as char
    position++; whitespace()
    char closing = object ? '}' as char : ']' as char
    def result = object ? [:] : []
    if (position < input.length() && input.charAt(position) == closing) { position++; return result }
    while (true) {
      whitespace()
      String key = null
      if (object) {
        key = string()
        if (!(key ==~ /[a-z]+/) || result.containsKey(key)) { fail() }
        whitespace()
        if (position >= input.length() || input.charAt(position++) != ':' as char) { fail() }
      }
      def item = value(depth + 1)
      if (object) { result[key] = item } else { result.add(item) }
      whitespace()
      if (position >= input.length()) { fail() }
      char separator = input.charAt(position++)
      if (separator == closing) { return result }
      if (separator != ',' as char) { fail() }
    }
  }
  def result = value(0)
  whitespace()
  if (position != input.length()) { fail() }
  result
}
def validateShape = { Map scenario ->
  def source = scenario.source ?: scenario.id ?: 'declaration'
  def contract = scenario.contract
  if (contract == null) { return null }
  exactFields(contract, ['type','objects','preserve','assertion'], ['custom'], source)
  if (!(contract.type in ['additive','replacement','data'])) {
    throw new GradleException("Invalid declared contract type at ${source}")
  }
  if (!(contract.assertion instanceof String) || !(contract.assertion ==~ /[a-z][a-z0-9._-]*/)) {
    throw new GradleException("Invalid assertion group at ${source}")
  }
  exactFields(contract.objects, ['created','replaced'], [], source)
  def identities = []
  ['created','replaced'].each { change ->
    def objects = contract.objects[change]
    if (!(objects instanceof List)) { throw new GradleException("Invalid changed objects at ${source}") }
    objects.each { object ->
      exactFields(object, ['kind','identity'], [], source)
      if (!(object.kind in ['routine','table','view','enum','sequence']) ||
          !(object.kind == 'routine' ? routineName(object.identity) : objectName(object.identity)) ||
          (change == 'replaced' && object.kind != 'routine')) {
        throw new GradleException("Unsupported changed object at ${source}")
      }
      def identity = "${object.kind}:${object.identity}".toString()
      if (identity in identities) { throw new GradleException("Duplicate changed object at ${source}") }
      identities.add(identity)
    }
  }
  if ((contract.type == 'additive' && (contract.objects.created.isEmpty() || !contract.objects.replaced.isEmpty())) ||
      (contract.type == 'replacement' && contract.objects.replaced.isEmpty()) ||
      (contract.type == 'data' && (!contract.objects.created.isEmpty() || !contract.objects.replaced.isEmpty() ||
        !(contract.custom instanceof Map) || !contract.custom.containsKey('verify')))) {
    throw new GradleException("Declared contract type differs from object changes at ${source}")
  }
  exactFields(contract.preserve, ['rows','tables','routines','enums','sequences'], [], source)
  contract.preserve.each { kind, names ->
    if (!(names instanceof List) || names.toSet().size() != names.size() ||
        !names.every { kind == 'routines' ? routineName(it) : objectName(it) }) {
      throw new GradleException("Invalid preservation scope at ${source}")
    }
    def objectKind = [rows:'table',tables:'table',routines:'routine',enums:'enum',sequences:'sequence'][kind]
    if (names.any { "${objectKind}:${it}".toString() in identities }) {
      throw new GradleException("Changed objects overlap preservation scope at ${source}")
    }
  }
  if (contract.containsKey('custom')) {
    exactFields(contract.custom, [], ['prepare','verify'], source)
    if (contract.custom.isEmpty() || !contract.custom.values().every {
        contractPath(it) && it.startsWith('src/dbUnitTest/upgradeCases/') && it.endsWith('.sql') && !it.endsWith('_pgtap_tests.sql') }) {
      throw new GradleException("Invalid custom contract case at ${source}")
    }
    if (contract.custom.containsKey('prepare') && scenario.data != 'approved-synthetic') {
      throw new GradleException("Custom preparation requires approved-synthetic at ${source}")
    }
  }
  contract
}
ext.parseDbUpgradeContractMetadata = { String input, String source ->
  def item = constrainedJson(input, source)
  exactFields(item, ['id','candidate','scope','data'], ['inputs','contract'], source)
  if (!['id','candidate','scope','data'].every { item[it] instanceof String } ||
      !(item.id ==~ /[a-z][a-z0-9._-]*/) || !contractPath(item.candidate) ||
      !(item.scope in ['both','upgrade']) || !(item.data in ['migration-created-only','approved-synthetic'])) {
    throw new GradleException("Invalid metadata value at ${source}")
  }
  if (!item.containsKey('inputs')) { item.inputs = [] }
  if (!(item.inputs instanceof List) || item.inputs.toSet().size() != item.inputs.size() || !item.inputs.every { contractPath(it) }) {
    throw new GradleException("Invalid dependency inputs at ${source}")
  }
  validateShape(item + [source:source])
  item
}
def regularRepositoryFile = { File repository, String path ->
  if (!contractPath(path)) { throw new GradleException("Noncanonical contract dependency: ${path}") }
  def base = repository.canonicalFile.toPath()
  def component = base
  path.split('/').each { part ->
    component = component.resolve(part)
    if (Files.isSymbolicLink(component)) { throw new GradleException("Symbolic contract dependency: ${path}") }
  }
  def target = new File(repository, path)
  if (!target.isFile() || target.canonicalFile != new File(repository.canonicalFile, path).absoluteFile) {
    throw new GradleException("Missing or noncanonical contract dependency: ${path}")
  }
  target
}
ext.validateDbUpgradeContract = { Map scenario, File repository ->
  def contract = validateShape(scenario)
  if (contract != null) {
    (contract.custom ?: [:]).each { phase, path -> regularRepositoryFile(repository, path) }
  }
  contract
}
ext.dbUpgradeContractCustomScripts = { Map scenario, File repository ->
  def contract = project.ext.validateDbUpgradeContract(scenario, repository)
  (contract?.custom ?: [:]).collectEntries { phase, path -> [(phase):regularRepositoryFile(repository, path)] }
}
ext.dbUpgradeContractVariables = { Map scenario ->
  def contract = validateShape(scenario)
  if (contract == null) { throw new GradleException('Shared dispatch requires a compact contract') }
  [opal_contract_json:JsonOutput.toJson(contract), opal_assertion_group:contract.assertion]
}
ext.dbUpgradeSupportFiles = { File repository ->
  def manifestPath = 'src/dbUnitTest/support/manifest.json'
  def expected = ['src/dbUnitTest/framework/upgrade_lifecycle.sql',
    'src/dbUnitTest/support/upgrade_contract.sql','src/dbUnitTest/support/upgrade_dispatch.sql']
  def manifest = regularRepositoryFile(repository, manifestPath)
  def declaration = constrainedJson(manifest.text, manifestPath)
  exactFields(declaration, ['files'], [], manifestPath)
  if (declaration.files != expected) { throw new GradleException('Shared support manifest differs from its fixed supported dependency set') }
  [manifest] + expected.collect { regularRepositoryFile(repository, it) }
}
tasks.register('dbUnitTestContractTest') {
  group = 'Verification'
  description = 'Verifies compact upgrade contract metadata and support manifests'
  doLast {
    def marker = '{"id":"fixture.create","candidate":"ddl/V2_0__fixture.sql","scope":"both",' +
      '"data":"migration-created-only","contract":{"type":"additive","objects":{"created":[' +
      '{"kind":"routine","identity":"public.fixture(bigint,json)"}],"replaced":[]},' +
      '"preserve":{"rows":["public.notes"],"tables":["public.notes"],"routines":[],' +
      '"enums":[],"sequences":["public.note_id_seq"]},"assertion":"fixture.current"}}'
    assert project.ext.has('parseDbUpgradeContractMetadata') : 'Compact contract parser is required'
    def parsed = project.ext.parseDbUpgradeContractMetadata(marker, 'fixed-contract')
    assert parsed.contract.preserve.rows == ['public.notes']
    assert parsed.contract.objects.created[0].identity == 'public.fixture(bigint,json)'
    logger.lifecycle('Contract regression compact declaration: PASS')
    int checks = 1
    def rejects = { String name, String value ->
      boolean rejected = false
      try { project.ext.parseDbUpgradeContractMetadata(value, name) }
      catch (GradleException expected) { rejected = true }
      assert rejected : "Expected contract rejection: ${name}"
      checks++
    }
    ['duplicate-root':marker.replace('"id":','"id":"other","id":'),
     'duplicate-nested':marker.replace('"assertion":','"assertion":"other","assertion":'),
     'unknown-root':marker.replace('"scope":','"unknown":'),
     'unknown-nested':marker.replace('"assertion":','"unknown":'),
     'missing-type':marker.replace('"type":"additive",',''),
     'unknown-type':marker.replace('"type":"additive"','"type":"unknown"'),
     'wrong-replacement-type':marker.replace('"type":"additive"','"type":"replacement"'),
     'wrong-data-type':marker.replace('"type":"additive"','"type":"data"'),
     'missing-nested':marker.replace('"enums":[],',''),
     'scalar':marker.replace('"both"','true'),
     'escape':marker.replace('public.notes','public\\u002enotes'),
     'raw-sql':marker.replace('public.fixture(bigint,json)','public.fixture(bigint);DROP TABLE public.notes'),
     'path-traversal':marker.replace('ddl/V2_0__fixture.sql','../V2_0__fixture.sql'),
     'unknown-kind':marker.replace('"routine"','"trigger"'),
     'noncanonical-type-alias':marker.replace('public.fixture(bigint,json)','public.fixture(int8,json)'),
     'unqualified-table':marker.replace('public.notes','notes'),
     'wrong-scope':marker.replace('"rows":["public.notes"]','"rows":"public.notes"'),
     'duplicate-scope':marker.replace('"rows":["public.notes"]','"rows":["public.notes","public.notes"]'),
     'reserved-schema':marker.replace('public.notes','pg_catalog.pg_proc'),
     'trailing-comma':marker.substring(0,marker.length()-1)+',}',
     'oversized':' ' * 65537,
     'excess-depth':'[' * 10 + ']' * 10].each { name, value -> rejects(name, value) }
    def overlap = new groovy.json.JsonSlurper().parseText(marker)
    overlap.contract.preserve.routines = ['public.fixture(bigint,json)']
    rejects('changed-preserved-overlap', JsonOutput.toJson(overlap))
    def replacement = new groovy.json.JsonSlurper().parseText(marker)
    replacement.contract.objects.replaced = replacement.contract.objects.created
    replacement.contract.objects.created = []
    replacement.contract.type = 'replacement'
    assert project.ext.parseDbUpgradeContractMetadata(JsonOutput.toJson(replacement), 'routine-replacement').contract.objects.replaced.size() == 1
    checks++
    replacement.contract.objects.replaced = [[kind:'table',identity:'public.notes']]
    rejects('unsupported-table-replacement',JsonOutput.toJson(replacement))
    def custom = new groovy.json.JsonSlurper().parseText(marker)
    custom.contract.custom = [prepare:'src/dbUnitTest/upgradeCases/fixture.sql']
    rejects('unapproved-custom-prepare',JsonOutput.toJson(custom))
    custom.data = 'approved-synthetic'
    assert project.ext.parseDbUpgradeContractMetadata(JsonOutput.toJson(custom),'approved-prepare').contract.custom.prepare
    checks++
    def dataContract = new groovy.json.JsonSlurper().parseText(marker)
    dataContract.contract.type='data'
    dataContract.contract.objects.created=[]
    rejects('data-contract-missing-verifier',JsonOutput.toJson(dataContract))
    dataContract.contract.custom=[verify:'src/dbUnitTest/upgradeCases/fixture.sql']
    assert project.ext.parseDbUpgradeContractMetadata(JsonOutput.toJson(dataContract),'data-contract').contract.type=='data'
    checks++
    custom.contract.custom.prepare = 'src/dbUnitTest/support/fixture.sql'
    rejects('custom-case-outside-layout',JsonOutput.toJson(custom))
    def legacy = '{"id":"fixture.legacy","candidate":"ddl/V2_0__fixture.sql","scope":"both","data":"migration-created-only"}'
    assert !project.ext.parseDbUpgradeContractMetadata(legacy,'legacy').containsKey('contract')
    assert project.ext.validateDbUpgradeContract([id:'legacy'],rootDir) == null
    checks++
    assert project.ext.dbUpgradeContractVariables(parsed).opal_assertion_group == 'fixture.current'
    assert new groovy.json.JsonSlurper().parseText(project.ext.dbUpgradeContractVariables(parsed).opal_contract_json) == parsed.contract
    checks++
    assert project.ext.dbUpgradeSupportFiles(rootDir).size()==4
    checks++
    def temporary = Files.createTempDirectory('opal-contract-metadata-').toFile()
    def fileRejects = { String name, Closure action ->
      boolean rejected = false
      try { action() } catch (GradleException expected) { rejected = true }
      assert rejected : "Expected filesystem contract rejection: ${name}"
      checks++
    }
    try {
      def supportPaths = ['src/dbUnitTest/framework/upgrade_lifecycle.sql',
        'src/dbUnitTest/support/upgrade_contract.sql','src/dbUnitTest/support/upgrade_dispatch.sql']
      supportPaths.each { path -> def target = new File(temporary,path); target.parentFile.mkdirs(); target.text='fixed metadata fixture\n' }
      def manifest = new File(temporary,'src/dbUnitTest/support/manifest.json')
      manifest.text = JsonOutput.toJson([files:supportPaths])
      assert project.ext.dbUpgradeSupportFiles(temporary).size()==4
      checks++
      def validManifest = manifest.text
      ['malformed':'{bad}','unknown-field':JsonOutput.toJson([unknown:supportPaths]),
       'extra-file':JsonOutput.toJson([files:supportPaths+['src/dbUnitTest/support/extra.sql']]),
       'duplicate-file':JsonOutput.toJson([files:supportPaths+[supportPaths[0]]]),
       'wrong-order':JsonOutput.toJson([files:supportPaths.reverse()]),
       'wrong-path':JsonOutput.toJson([files:supportPaths.collect { it.replace('support/','supportx/') }]),
       'duplicate-key':'{"files":[],"files":[]}'].each { name, content ->
        manifest.text=content
        fileRejects(name) { project.ext.dbUpgradeSupportFiles(temporary) }
      }
      manifest.delete()
      fileRejects('missing-manifest') { project.ext.dbUpgradeSupportFiles(temporary) }
      manifest.text=validManifest
      def customScenario = new groovy.json.JsonSlurper().parseText(marker)
      customScenario.data='approved-synthetic'
      customScenario.contract.custom=[prepare:'src/dbUnitTest/upgradeCases/fixture.sql']
      fileRejects('missing-custom-case') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      def customFile = new File(temporary,customScenario.contract.custom.prepare)
      customFile.parentFile.mkdirs(); customFile.text='fixed fixture\n'
      assert project.ext.dbUpgradeContractCustomScripts(customScenario,temporary).prepare == customFile
      checks++
      customFile.delete()
      Files.createSymbolicLink(customFile.toPath(),manifest.toPath())
      fileRejects('live-leaf-symlink') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      Files.delete(customFile.toPath())
      Files.createSymbolicLink(customFile.toPath(),new File(temporary,'missing.sql').toPath())
      fileRejects('dangling-leaf-symlink') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      Files.delete(customFile.toPath()); customFile.parentFile.delete()
      def parent = customFile.parentFile.toPath()
      Files.createSymbolicLink(parent,new File(temporary,'src/dbUnitTest/support').toPath())
      fileRejects('live-parent-symlink') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      Files.delete(parent)
      Files.createSymbolicLink(parent,new File(temporary,'missing-directory').toPath())
      fileRejects('dangling-parent-symlink') { project.ext.validateDbUpgradeContract(customScenario,temporary) }
      Files.delete(parent)
      def helper = new File(temporary,supportPaths[1]); helper.delete()
      fileRejects('missing-fixed-support') { project.ext.dbUpgradeSupportFiles(temporary) }
      Files.createSymbolicLink(helper.toPath(),manifest.toPath())
      fileRejects('symbolic-fixed-support') { project.ext.dbUpgradeSupportFiles(temporary) }
      Files.delete(helper.toPath())
    } finally { temporary.deleteDir() }
    logger.lifecycle("Contract metadata regressions: ${checks} passed")
  }
}

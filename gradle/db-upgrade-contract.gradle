// Frankie Moran — PO-10643 — 22/10/2026 — Verify bounded data observations and owner dispatch.
// Contracts supply values and identities; SQL support owns database assertions.
def contractPath = { Object value ->
  value instanceof String && value ==~ /[A-Za-z0-9_.\/-]+/ && !value.startsWith('/') &&
    !value.split('/', -1).any { it in ['', '.', '..'] }
}
def objectName = { Object value ->
  value instanceof String && value ==~ /[a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*/ &&
    !value.startsWith('pg_') && !value.startsWith('information_schema.') &&
    !value.startsWith('opal_test_upgrade_observation.') &&
    !value.startsWith('opal_db_unit_test_framework_state.')
}
def routineName = { Object value ->
  if (!(value instanceof String)) { return false }
  def match = value =~ /^([a-z_][a-z0-9_]*\.[a-z_][a-z0-9_]*)\((.*)\)$/
  if (!match.matches() || !objectName(match[0][1])) { return false }
  def arguments = match[0][2]
  arguments.isEmpty() || arguments.split(',', -1).every { type ->
    def scalar = type.endsWith('[]') ? type.substring(0,type.length()-2) : type
    scalar in ['bigint','integer','smallint','boolean','text','json','jsonb','character varying',
      'character','timestamp without time zone','timestamp with time zone','date','numeric',
      'real','double precision','uuid','bytea','time without time zone','time with time zone',
      'interval','bit','bit varying'] || objectName(scalar)
  }
}
def exactFields = { Object value, List required, List optional, String source ->
  if (!(value instanceof Map) || !value.keySet().containsAll(required) ||
      !(required + optional).containsAll(value.keySet())) {
    throw new GradleException("Unknown or missing contract field at ${source}")
  }
}
// This bounded JSON subset retains duplicate-key evidence before constructing maps.
// Strings are literal printable ASCII: no escapes, control bytes or scalar SQL fragments.
def constrainedJson = { String input, String source ->
  if (input == null || input.length() > 65536) { throw new GradleException("Oversized contract metadata at ${source}") }
  int position = 0, nodes = 0
  def fail = { throw new GradleException("Malformed contract metadata at ${source}") }
  def whitespace = { while (position < input.length() && input.charAt(position) in [' ' as char,'\t' as char,'\r' as char,'\n' as char]) { position++ } }
  def string = {
    if (position >= input.length() || input.charAt(position++) != '"' as char) { fail() }
    def result = new StringBuilder()
    while (position < input.length() && input.charAt(position) != '"' as char) {
      char next = input.charAt(position++)
      if (next < 32 || next > 126 || next == '\\' as char || result.length() >= 4096) { fail() }
      result.append(next)
    }
    if (position >= input.length()) { fail() }
    position++
    result.toString()
  }
  Closure value
  value = { int depth ->
    if (depth > 8 || ++nodes > 4096) { fail() }
    whitespace()
    if (position >= input.length()) { fail() }
    char next = input.charAt(position)
    if (next == '"' as char) { return string() }
    if (!(next in ['{' as char,'[' as char])) { fail() }
    boolean object = next == '{' as char
    position++; whitespace()
    char closing = object ? '}' as char : ']' as char
    def result = object ? [:] : []
    if (position < input.length() && input.charAt(position) == closing) { position++; return result }
    while (true) {
      whitespace()
      String key = null
      if (object) {
        key = string()
        if (!(key ==~ /[a-z]+/) || result.containsKey(key)) { fail() }
        whitespace()
        if (position >= input.length() || input.charAt(position++) != ':' as char) { fail() }
      }
      def item = value(depth + 1)
      if (object) { result[key] = item } else { result.add(item) }
      whitespace()
      if (position >= input.length()) { fail() }
      char separator = input.charAt(position++)
      if (separator == closing) { return result }
      if (separator != ',' as char) { fail() }
    }
  }
  def result = value(0)
  whitespace()
  if (position != input.length()) { fail() }
  result
}
def validateShape = { Map scenario ->
  def source = scenario.source ?: scenario.id ?: 'declaration'
  def contract = scenario.contract
  if (contract == null) { return null }
  exactFields(contract, ['type','objects','preserve','assertion'], ['custom','observe'], source)
  if (!(contract.type in ['additive','replacement','data'])) {
    throw new GradleException("Invalid declared contract type at ${source}")
  }
  if (!(contract.assertion instanceof String) || !(contract.assertion ==~ /[a-z][a-z0-9._-]*/)) {
    throw new GradleException("Invalid assertion group at ${source}")
  }
  exactFields(contract.objects, ['created','replaced'], [], source)
  def identities = []
  ['created','replaced'].each { change ->
    def objects = contract.objects[change]
    if (!(objects instanceof List)) { throw new GradleException("Invalid changed objects at ${source}") }
    objects.each { object ->
      exactFields(object, ['kind','identity'], [], source)
      if (!(object.kind in ['routine','table','view','enum','sequence']) ||
          !(object.kind == 'routine' ? routineName(object.identity) : objectName(object.identity)) ||
          (change == 'replaced' && object.kind != 'routine')) {
        throw new GradleException("Unsupported changed object at ${source}")
      }
      def identity = "${object.kind}:${object.identity}".toString()
      if (identity in identities) { throw new GradleException("Duplicate changed object at ${source}") }
      identities.add(identity)
    }
  }
  if ((contract.type == 'additive' && (contract.objects.created.isEmpty() || !contract.objects.replaced.isEmpty())) ||
      (contract.type == 'replacement' && contract.objects.replaced.isEmpty()) ||
      (contract.type == 'data' && (!contract.objects.created.isEmpty() || !contract.objects.replaced.isEmpty() ||
        !(contract.custom instanceof Map) || !contract.custom.containsKey('verify')))) {
    throw new GradleException("Declared contract type differs from object changes at ${source}")
  }
  exactFields(contract.preserve, ['rows','tables','routines','enums','sequences'], [], source)
  contract.preserve.each { kind, names ->
    if (!(names instanceof List) || names.toSet().size() != names.size() ||
        !names.every { kind == 'routines' ? routineName(it) : objectName(it) }) {
      throw new GradleException("Invalid preservation scope at ${source}")
    }
    def objectKind = [rows:'table',tables:'table',routines:'routine',enums:'enum',sequences:'sequence'][kind]
    if (names.any { "${objectKind}:${it}".toString() in identities }) {
      throw new GradleException("Changed objects overlap preservation scope at ${source}")
    }
  }
  if (contract.containsKey('observe')) {
    if (contract.type != 'data') { throw new GradleException("Observation scope requires a data contract at ${source}") }
    exactFields(contract.observe, ['rows','sequences'], [], source)
    contract.observe.each { kind, names ->
      if (!(names instanceof List) || names.toSet().size() != names.size() || !names.every { objectName(it) }) {
        throw new GradleException("Invalid observation scope at ${source}")
      }
      if (names.any { it in contract.preserve[kind] }) {
        throw new GradleException("Observed objects overlap exact preservation scope at ${source}")
      }
    }
    if (contract.observe.values().every { it.isEmpty() }) {
      throw new GradleException("Observation scope must not be empty at ${source}")
    }
  }
  if (contract.containsKey('custom')) {
    exactFields(contract.custom, [], ['prepare','verify'], source)
    if (contract.custom.isEmpty() || !contract.custom.every { phase, path ->
        (phase == 'verify' && path == 'owner') ||
          (contractPath(path) && path.startsWith('src/dbUnitTest/upgradeCases/') &&
            path.endsWith('.sql') && !path.endsWith('_pgtap_tests.sql')) }) {
      throw new GradleException("Invalid custom contract case at ${source}")
    }
    if (contract.custom.containsKey('prepare') && scenario.data != 'approved-synthetic') {
      throw new GradleException("Custom preparation requires approved-synthetic at ${source}")
    }
  }
  contract
}
ext.parseDbUpgradeContractMetadata = { String input, String source ->
  def item = constrainedJson(input, source)
  exactFields(item, ['id','candidate','scope','data'], ['inputs','contract'], source)
  if (!['id','candidate','scope','data'].every { item[it] instanceof String } ||
      !(item.id ==~ /[a-z][a-z0-9._-]*/) || !contractPath(item.candidate) ||
      !(item.scope in ['both','upgrade']) || !(item.data in ['migration-created-only','approved-synthetic'])) {
    throw new GradleException("Invalid metadata value at ${source}")
  }
  if (!item.containsKey('inputs')) { item.inputs = [] }
  if (!(item.inputs instanceof List) || item.inputs.toSet().size() != item.inputs.size() || !item.inputs.every { contractPath(it) }) {
    throw new GradleException("Invalid dependency inputs at ${source}")
  }
  validateShape(item + [source:source])
  item
}
def regularRepositoryFile = { File repository, String path ->
  if (!contractPath(path)) { throw new GradleException("Noncanonical contract dependency: ${path}") }
  def base = repository.canonicalFile.toPath()
  def component = base
  path.split('/').each { part ->
    component = component.resolve(part)
    if (Files.isSymbolicLink(component)) { throw new GradleException("Symbolic contract dependency: ${path}") }
  }
  def target = new File(repository, path)
  if (!target.isFile() || target.canonicalFile != new File(repository.canonicalFile, path).absoluteFile) {
    throw new GradleException("Missing or noncanonical contract dependency: ${path}")
  }
  target
}
def customContractFile = { Map scenario, File repository, String phase, String path ->
  if (path != 'owner') { return regularRepositoryFile(repository, path) }
  if (phase != 'verify' || !(scenario.owner instanceof File)) {
    throw new GradleException('Owner verifier requires its declaring owning SQL file')
  }
  def base = repository.absoluteFile.toPath()
  def owner = scenario.owner.absoluteFile.toPath()
  if (owner != owner.normalize()) { throw new GradleException('Owner verifier requires a canonical owning SQL path') }
  if (!owner.startsWith(base)) { throw new GradleException('Owner verifier must be beneath src/dbUnitTest') }
  def relative = base.relativize(owner).toString().replace(File.separator, '/')
  if (!contractPath(relative) || !relative.startsWith('src/dbUnitTest/') || !relative.endsWith('.sql')) {
    throw new GradleException('Owner verifier requires a canonical SQL file beneath src/dbUnitTest')
  }
  regularRepositoryFile(repository, relative)
}
ext.validateDbUpgradeContract = { Map scenario, File repository ->
  def contract = validateShape(scenario)
  if (contract != null) {
    (contract.custom ?: [:]).each { phase, path -> customContractFile(scenario, repository, phase, path) }
  }
  contract
}
ext.dbUpgradeContractCustomScripts = { Map scenario, File repository ->
  def contract = project.ext.validateDbUpgradeContract(scenario, repository)
  (contract?.custom ?: [:]).collectEntries { phase, path -> [(phase):customContractFile(scenario, repository, phase, path)] }
}
ext.dbUpgradeContractVariables = { Map scenario ->
  def contract = validateShape(scenario)
  if (contract == null) { throw new GradleException('Shared dispatch requires a compact contract') }
  [opal_contract_json:JsonOutput.toJson(contract), opal_assertion_group:contract.assertion]
}
ext.dbUpgradeSupportFiles = { File repository ->
  def manifestPath = 'src/dbUnitTest/support/manifest.json'
  def expected = ['src/dbUnitTest/framework/upgrade_lifecycle.sql',
    'src/dbUnitTest/support/upgrade_contract.sql','src/dbUnitTest/support/upgrade_dispatch.sql',
    'src/dbUnitTest/support/parent_transition.sql']
  def manifest = regularRepositoryFile(repository, manifestPath)
  def declaration = constrainedJson(manifest.text, manifestPath)
  exactFields(declaration, ['files'], [], manifestPath)
  if (declaration.files != expected) { throw new GradleException('Shared support manifest differs from its fixed supported dependency set') }
  [manifest] + expected.collect { regularRepositoryFile(repository, it) }
}

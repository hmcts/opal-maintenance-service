      if (!observed.message.contains(diagnostic)) { throw observed }
      if (!(name in ['primary-plus-cleanup','shared-primary-plus-cleanup']) && observed.suppressed.length != 0) { throw observed }
      run.evidence.add("Regression ${name}: expected failure verified (${diagnostic})")

def digest = { File source -> MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString() }
def relative = { File root, File source -> root.toPath().relativize(source.toPath()).toString().replace(File.separator, '/') }
def execute = { List command ->
  def output = providers.exec {
    commandLine command.collect { it.toString() }
    ignoreExitValue = true
  }
  [exitCode: output.result.get().exitValue, stdout: output.standardOutput.asText.get(),
   stderr: output.standardError.asText.get()]
}
def normalizeVersion = { String value ->
  if (!(value ==~ /[0-9]+(?:[._][0-9]+)*/)) {
    throw new GradleException('Unsupported numerical migration version')
  }
  def parts = value.split(/[._]/).collect { new BigInteger(it) }
  while (parts.size() > 1 && parts.last() == BigInteger.ZERO) { parts.removeLast() }
  parts.join('.')
}
def compareVersions = { String left, String right ->
  def a = left.split(/\./).collect { new BigInteger(it) }
  def b = right.split(/\./).collect { new BigInteger(it) }
  int order = 0
  for (int i = 0; i < Math.max(a.size(), b.size()) && order == 0; i++) {
    order = (i < a.size() ? a[i] : BigInteger.ZERO) <=> (i < b.size() ? b[i] : BigInteger.ZERO)
  }
  order
}
def inventory = { File root, List locations ->
  def entries = locations.collectMany { location ->
    def directory = new File(root, location)
    if (!directory.isDirectory()) { throw new GradleException("Missing migration location: ${location}") }
    fileTree(directory).files.findAll { it.isFile() && it.name != '.gitkeep' }.collect { source ->
      def path = relative(root, source)
      def matcher = source.name =~ /^V([0-9]+(?:[._][0-9]+)*)__([A-Za-z0-9_]+)\.sql$/
      if (!matcher.matches()) { throw new GradleException("Unsupported migration file: ${path}") }
      [path: path, script: source.name, version: normalizeVersion(matcher[0][1]), sha256: digest(source)]
    }
  }.sort { a, b -> compareVersions(a.version, b.version) }
  if (entries.isEmpty()) { throw new GradleException('No selected migrations') }
  entries.groupBy { it.version }.each { version, duplicates ->
    if (duplicates.size() != 1) {
      throw new GradleException("Duplicate normalized migration version ${version}: ${duplicates*.path.join(', ')}")
    }
  }
  entries
}
// The selection module validates constrained registration metadata before JSON parsing.
def parseMetadata = { String input, String source ->
  input.contains('"contract"') ? project.ext.parseDbUpgradeContractMetadata(input, source) :
    project.ext.parseDbUpgradeMetadata(input, source)
}
def resolveRegistrations = { List items, List entries ->
  items.each { item ->
    def candidate = entries.find { it.path == item.candidate }
    if (candidate == null) { throw new GradleException("Missing or unselected candidate at ${item.source}: ${item.candidate}") }
    if (item.contract != null) {
      item.contract = project.ext.validateDbUpgradeContract(item, rootDir)
      // Custom assertion/setup files affect their declared owner's selection.
      def customInputs = (item.contract.custom ?: [:]).values().toList()
      item.inputs = ((item.inputs ?: []) + customInputs).unique()
    }
    project.ext.validateDbUpgradeInputs(item, rootDir)
    item.version = candidate.version
    if (new File(migrationRoot, item.candidate).canonicalFile != new File(migrationRoot, item.candidate).absoluteFile) {
      throw new GradleException("Noncanonical candidate at ${item.source}")
    }
    if (item.data == 'approved-synthetic' && !item.owner.text.contains('Approved data scenario:')) {
      throw new GradleException("Approved data scenario reference missing at ${item.source}")
    }
  }
  items.groupBy { it.id }.each { id, owners ->
    if (owners.size() != 1) { throw new GradleException("Duplicate scenario ID ${id}: ${owners*.source.join(', ')}") }
  }
  items.groupBy { it.candidate }.each { candidate, owners ->
    if (owners.size() != 1) { throw new GradleException("Multiple owners for ${candidate}: ${owners*.source.join(', ')}") }
  }
  items.sort { a, b -> compareVersions(a.version, b.version) }
}
def registrations = { List suites, List entries ->
  def items = []
  suites.each { suite ->
    suite.readLines().eachWithIndex { line, index ->
      if (line.contains('OPAL-DB-UPGRADE')) {
        def source = "${relative(sqlRoot, suite)}:${index + 1}"
        def marker = line =~ /^\s*-- OPAL-DB-UPGRADE (.*)$/
        if (!marker.matches()) { throw new GradleException("Malformed upgrade declaration at ${source}") }
        items.add(parseMetadata(marker[0][1], source) + [owner: suite, source: source])
      }
    }
  }
  resolveRegistrations(items, entries)
}
def validateAdoption = { List entries, List scenarios, Map adoption ->
  adoption.each { path, original ->
    def actual = entries.find { it.path == path }
    if (actual == null || actual.version != original.version || actual.sha256 != original.sha256) {
      throw new GradleException("Adopted migration missing or altered: ${path}")
    }
  }
  def missing = entries.findAll { !adoption.containsKey(it.path) && !scenarios.any { s -> s.candidate == it.path } }
  if (!missing.isEmpty()) { throw new GradleException("Missing upgrade registration: ${missing*.path.join(', ')}") }
}
def validateOptions = { String selection, boolean baseline, List scenarios ->
  if (selection == null) { return scenarios }
  if (baseline) { throw new GradleException('dbUnitTestUpgradeSuite is prohibited with check/build') }
  if (!(selection ==~ /[A-Za-z0-9_\/-]+\.sql/) || selection.startsWith('/') || selection.split('/').contains('..')) {
    throw new GradleException('Invalid dbUnitTestUpgradeSuite path')
  }
  def chosen = scenarios.findAll { relative(sqlRoot, it.owner) == selection }
  if (chosen.isEmpty()) { throw new GradleException('Unknown suite or no upgrade registrations selected') }
  chosen
}
def refuseExternal = { Map environment ->
  def names = environment.findAll { name, value ->
    value != null && !value.toString().isBlank() &&
      (name.startsWith('FLYWAY_') || name.startsWith('OPAL_MAINTENANCE_DB_') || name in ['PGSERVICE','PGSERVICEFILE','PGOPTIONS'])
  }.keySet().sort()
  if (!names.isEmpty()) { throw new GradleException("dbUnitTest refuses external database settings: ${names.join(', ')}") }
}
def expectedHistory = { List entries -> JsonOutput.toJson(entries.collect { [version: it.version, script: it.script] }) }
def newRun = { String mode ->
  def base = layout.buildDirectory.dir('reports/dbUnitTest').get().asFile
  def directory = new File(base, "runs/${System.currentTimeMillis()}-${UUID.randomUUID()}")
  directory.mkdirs()
  def git = execute(['git', 'rev-parse', 'HEAD'])
  def dirty = execute(['git', 'status', '--short'])
  def fingerprintFiles = [file('gradle/db-unit-test.gradle'), file('gradle/db-upgrade-contract.gradle'), file('gradle/db-upgrade-selection.gradle'),
    file('gradle/db-upgrade-selection-test.gradle'), dockerfile] + fileTree(sqlRoot).files + fileTree(migrationRoot).files
  def fingerprints = fingerprintFiles.findAll { it.isFile() }.sort { it.path }.collect { "${relative(rootDir, it)} ${digest(it)}" }
  new File(directory, 'source-sha256.txt').text = fingerprints.join('\n') + '\n'
  [base: base, directory: directory, started: System.nanoTime(), evidence: ["Mode: ${mode}", "Requested tasks: ${gradle.startParameter.taskNames}",
    "Started: ${java.time.Instant.now()}", "Git revision: ${git.stdout.trim()}",
    "Dirty files:\n${dirty.stdout}", "Source fingerprints: source-sha256.txt",
    'Adoption foundation: 847739c9ee40ca1c09687756212f7f0dcbb56e7d; 32 selected migrations',
    "Java: ${System.getProperty('java.version')}; Gradle: ${gradle.gradleVersion}", "Flyway image: ${flywayImage}",
    'Application Flyway plugin/runtime: 13.10.0 (unchanged)'], statuses: [:], discovered: 0, scheduled: 0, attempted: 0, completed: 0]
}
def finishRun = { Map run, Throwable failure ->
  if (failure != null) {
    run.statuses.replaceAll { name, status -> status == 'RUNNING' ? 'FAILED' : status == 'Not run' ? 'Not run — earlier failure' : status }
  }
  run.evidence.add("Upgrade scenarios: discovered ${run.discovered}; selected ${run.scheduled}; attempted ${run.attempted}; completed ${run.completed}")
  run.evidence.add("Duration milliseconds: ${TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - run.started)}")
  run.statuses.each { name, status -> run.evidence.add("Scenario ${name}: ${status}") }
  run.evidence.add(failure == null ? 'Result: PASS' : "Result: FAILED - ${failure.message}")
  def content = run.evidence.join('\n') + '\n'
  new File(run.directory, 'summary.txt').text = content
  new File(run.base, 'summary.txt').text = "Run: ${run.directory.name}\n" + content
  logger.lifecycle("Database verification report: ${run.directory}")
}
def command = { Map target, String label, List args ->
  def number = target.sequence++
  def started = System.nanoTime()
  def result
  if (target.injection == label) {
    result = [exitCode: 71, stdout: '', stderr: "fixed framework command failure: ${label}\n"]
  } else {
    result = execute(args)
  }
  def output = "Command: ${args.collect { it.toString().startsWith('-url=') ? '-url=<disposable target>' : it }.join(' ')}\n" +
    "Exit: ${result.exitCode}; Duration milliseconds: ${TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - started)}\n" + result.stdout + result.stderr
  new File(target.directory, String.format('%03d-%s.log', number, label)).text = output
  target.evidence.add("${label}: exit ${result.exitCode}")
  target.phases[label] = result.exitCode == 0 ? 'PASS' : 'FAILED'
  result
}
def requireCommand = { Map target, String label, List args ->
  def result = command(target, label, args)
  if (result.exitCode != 0) { throw new GradleException("${label} failed (exit ${result.exitCode}): ${result.stdout}${result.stderr}") }
  result
}
def prove = { Map target, String label, List suites, Map variables ->
  def args = ['docker', 'exec', target.name, 'pg_prove', '--verbose', '-h', 'localhost', '-U', 'postgres', '-d', databaseName,
    '--set', 'ON_ERROR_STOP=1']
  variables.each { key, value -> args.addAll(['--set', "${key}=${value}"]) }
  args.addAll(suites.collect { "/tmp/opal-db-unit-test/${relative(sqlRoot, it)}" })
  def result = command(target, label, args)
  if (label == 'fresh-suites') { new File(target.base, 'pg-prove.log').text = result.stdout + result.stderr }
  def plans = (result.stdout =~ /(?m)^\s*1\.\.([0-9]+)(?:\s.*)?$/).collect { it[1].toInteger() }
  def executed = (result.stdout =~ /(?m)^\s*(?:not )?ok\s+[0-9]+(?:\s.*)?$/).size()
  target.evidence.add("${label}: planned ${plans.sum() ?: 0}; executed ${executed}; suites ${suites.size()}")
  if (result.exitCode != 0 || plans.size() != suites.size() || plans.any { it <= 0 } || plans.sum() != executed) {
    target.phases[label] = 'FAILED'
    throw new GradleException("${label} pg_prove failed or lacked positive exact plans (exit ${result.exitCode}; planned ${plans}; executed ${executed}); see ${target.directory}")
  }
  result
}
def framework = { Map target, String phase, List entries, Map variables ->
  prove(target, "framework-${phase}", [frameworkSuite], variables +
    [opal_framework_phase: phase, opal_expected_history: expectedHistory(entries)])
}
def nativeFlyway = { Map target, String operation, String boundary ->
  def args = target.flyway + ['-outputType=json'] + (boundary == null ? [] : ["-target=${boundary}"]) + [operation]
  def result = requireCommand(target, "flyway-${operation}-${boundary ?: 'latest'}", args)
  try { new JsonSlurper().parseText(result.stdout) }
  catch (Exception ignored) { throw new GradleException("Invalid native Flyway JSON for ${operation}; see ${target.directory}") }
}
def crossCheckNative = { Map target, List entries ->
  def info = nativeFlyway(target, 'info', null)
  def nativeRows = info.migrations
  if (!(nativeRows instanceof List) || nativeRows.size() != entries.size()) {
    throw new GradleException('Native Flyway inventory count differs from selected files')
  }
  nativeRows.eachWithIndex { row, index ->
    def path = row.filepath ?: row.filePath ?: row.script
    if (row.type != 'SQL' || normalizeVersion(row.version.toString()) != entries[index].version || path == null
      || !path.toString().replace('\\', '/').endsWith('/' + entries[index].path)) {
      throw new GradleException("Native Flyway identity/order differs at ${entries[index].path}")
    }
  }
  target.evidence.add('Native Flyway numerical inventory and paths: verified')
}
def targetLifecycle = { Map run, String id, File root, List locations, String injection, Closure body ->
  def directory = new File(run.directory, id)
  directory.mkdirs()
  def target = [name: "opal-maintenance-db-unit-test-${UUID.randomUUID()}", directory: directory,
    base: run.base, started: System.nanoTime(), sequence: 0, injection: injection, evidence: [], phases: [:], declared: [], created: false, absent: true,
    volumeNames: [], volumesInspected: false, volumesAbsent: true]
  Throwable primary = null
  Throwable cleanup = null
  try {
    // Flag before docker run: even a failed/ambiguous start must attempt owned-name cleanup.
    target.created = true
    target.absent = false
    target.volumesAbsent = false
    requireCommand(target, 'start', ['docker','run','--detach','--rm','--name',target.name,
      '--env','POSTGRES_HOST_AUTH_METHOD=trust','--env',"POSTGRES_DB=${databaseName}",postgresImage])
    def mounts = new JsonSlurper().parseText(requireCommand(target, 'owned-volume-mounts',
      ['docker','inspect','--format','{{json .Mounts}}',target.name]).stdout)
    if (!(mounts instanceof List)) { throw new GradleException('Cannot identify owned anonymous target volumes') }
    // docker run supplies no volume names: these mounts were created for this exact UUID target.
    target.volumeNames = mounts.findAll { it.Type == 'volume' }.collect { it.Name }
    if (!target.volumeNames.every { it instanceof String && it ==~ /[a-f0-9]{64}/ }) {
      throw new GradleException('Disposable target contains an unexpected named volume')
    }
    target.volumesInspected = true
    target.evidence.add("Owned anonymous volumes: ${target.volumeNames}")
    boolean ready = false
    for (int attempt = 0; attempt < 60; attempt++) {
      def process = command(target, 'postgres-process', ['docker','exec',target.name,'cat','/proc/1/comm'])
      if (process.exitCode == 0 && process.stdout.trim() == 'postgres') {
        def readiness = command(target, 'readiness', ['docker','exec',target.name,'pg_isready','-U','postgres','-d',databaseName])
        if (readiness.exitCode == 0) { ready = true; break }
        if (injection == 'readiness') { break }
      }
      TimeUnit.SECONDS.sleep(1)
    }
    if (!ready) { throw new GradleException('Disposable PostgreSQL readiness failed') }
    def empty = requireCommand(target, 'empty-start', ['docker','exec',target.name,'psql','-X','-At','-v','ON_ERROR_STOP=1',
      '-U','postgres','-d',databaseName,'-c',"SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public'"])
    if (empty.stdout.trim() != '0') { throw new GradleException('Disposable database was not empty') }
    requireCommand(target, 'copy-suites', ['docker','cp',"${sqlRoot}/.","${target.name}:/tmp/opal-db-unit-test"])
    requireCommand(target, 'copy-replay-migrations', ['docker','cp',"${migrationRoot}/.","${target.name}:/tmp/opal-db-migrations"])
    target.flyway = ['docker','run','--rm','--network',"container:${target.name}"]
    locations.each { location -> target.flyway.addAll(['--volume',"${new File(root, location).absolutePath}:/flyway/sql/${location}:ro"]) }
    target.flyway.addAll([flywayImage,"-url=jdbc:postgresql://localhost:5432/${databaseName}",'-user=postgres',
      '-locations=' + locations.collect { "filesystem:/flyway/sql/${it}" }.join(','), '-baselineOnMigrate=false','-cleanDisabled=true'])
    target.evidence.add(requireCommand(target, 'postgres-version', ['docker','exec',target.name,'postgres','--version']).stdout.trim())
    target.evidence.add(requireCommand(target, 'pg-prove-version', ['docker','exec',target.name,'pg_prove','--version']).stdout.trim())
    body(target)
  } catch (Throwable failure) { primary = failure }
  finally {
    if (target.created) {
      try {
        requireCommand(target, 'remove', ['docker','rm','--force','--volumes',target.name])
        def remaining = requireCommand(target, 'absence', ['docker','ps','-a','--format','{{.Names}}'])
        target.absent = !remaining.stdout.readLines().contains(target.name.toString())
        if (!target.absent) { throw new GradleException("Owned container remains: ${target.name}") }
        if (!target.volumesInspected) { throw new GradleException('Owned volume inventory was not confirmed') }
        target.volumeNames.each { volume ->
          def retained = requireCommand(target, 'volume-absence',
            ['docker','volume','ls','--quiet','--filter',"name=^${volume}\$".toString()])
          if (!retained.stdout.isBlank()) { throw new GradleException("Owned anonymous volume remains: ${volume}") }
        }
        target.volumesAbsent = true
      } catch (Throwable failure) { cleanup = failure }
      // Fixed self-test injections must never leak their real container. This cannot turn failure into PASS.
      if (injection in ['remove','absence','volume-absence']) {
        def removed = execute(['docker','rm','--force','--volumes',target.name])
        def remaining = execute(['docker','ps','-a','--format','{{.Names}}'])
        target.evidence.add("Self-test remediation removal exit: ${removed.exitCode}")
        target.absent = remaining.exitCode == 0 && !remaining.stdout.readLines().contains(target.name.toString())
        target.volumesAbsent = target.volumesInspected && target.volumeNames.every { volume ->
          def retained = execute(['docker','volume','ls','--quiet','--filter',"name=^${volume}\$".toString()])
          retained.exitCode == 0 && retained.stdout.isBlank()
        }
        target.evidence.add("Self-test remediation owned volume absence: ${target.volumesAbsent}")
      }
    }
    target.evidence.add("Duration milliseconds: ${TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - target.started)}")
    target.declared.each { label -> target.evidence.add("Phase ${label}: ${target.phases[label] ?: 'Not run'}") }
    target.evidence.add("Owned container: ${target.name}; absence confirmed: ${target.absent}; owned volume absence confirmed: ${target.volumesAbsent}")
    if (primary != null) { target.evidence.add("Primary failure: ${primary.message}") }
    if (primary != null) {
      primary.suppressed.each { secondary -> target.evidence.add("Secondary failure: ${secondary.message}") }
    }
    if (cleanup != null) { target.evidence.add("Cleanup failure: ${cleanup.message}") }
    new File(directory, 'summary.txt').text = target.evidence.join('\n') + '\n'
    run.evidence.add("Target ${id}: ${target.name}; absence confirmed: ${target.absent}; owned volume absence confirmed: ${target.volumesAbsent}")
    if (primary != null && cleanup != null) { primary.addSuppressed(cleanup) }
    if ((!target.absent || !target.volumesAbsent) && cleanup == null) { cleanup = new GradleException("Cleanup unconfirmed: ${target.name}") }
  }
  if (primary != null) { throw primary }
  if (cleanup != null) { throw cleanup }
}
def runContractUpgrade = { Map target, List entries, Map scenario, String testCase ->
  int index = entries.findIndexOf { it.path == scenario.candidate }
  if (index <= 0) { throw new GradleException('Applicable upgrade requires a real predecessor') }
  def candidate = entries[index]
  def predecessor = entries[index - 1]
  def prior = entries.take(index)
  def current = entries.take(index + 1)
  def variables = [opal_scenario_id:scenario.id, opal_candidate_version:candidate.version,
    opal_predecessor_version:predecessor.version] + project.ext.dbUpgradeContractVariables(scenario)
  if (testCase != null) { variables.opal_test_case = testCase }
  def dispatcher = new File(sqlRoot, 'support/upgrade_dispatch.sql')
  def custom = project.ext.dbUpgradeContractCustomScripts(scenario, rootDir)
  target.evidence.add("Scenario ${scenario.id}; candidate ${candidate.path} (${candidate.version}); predecessor ${predecessor.path} (${predecessor.version}); shared contract; assertion group ${scenario.contract.assertion}")
  target.declared = ["flyway-migrate-${predecessor.version}", "flyway-validate-${predecessor.version}",
    'framework-predecessor'] + (custom.prepare ? ['custom-prepare'] : []) + ['shared-prepare',
    "flyway-migrate-${candidate.version}", "flyway-validate-${candidate.version}", 'framework-candidate',
    'shared-verify'] + (custom.verify ? ['custom-verify'] : []) + ['owner-verify',
    'framework-repeat', 'shared-cleanup', 'framework-cleanup']
  boolean historyCaptured = false
  boolean preparationAttempted = false
  Throwable primary = null
  try {
    crossCheckNative(target, entries)
    nativeFlyway(target, 'migrate', predecessor.version)
    nativeFlyway(target, 'validate', predecessor.version)
    framework(target, 'predecessor', prior, variables)
    historyCaptured = true
    if (custom.prepare) { prove(target, 'custom-prepare', [custom.prepare], variables + [opal_phase:'prepare']) }
    preparationAttempted = true
    prove(target, 'shared-prepare', [dispatcher], variables + [opal_phase:'prepare'])
    nativeFlyway(target, 'migrate', candidate.version)
    nativeFlyway(target, 'validate', candidate.version)
    framework(target, 'candidate', current, variables)
    if (testCase == 'contract-preservation-failure') {
      requireCommand(target, 'fixed-preservation-mutation', ['docker','exec',target.name,'psql','-X',
        '-v','ON_ERROR_STOP=1','-U','postgres','-d',databaseName,'-c',
        "UPDATE public.framework_reference SET label = 'fixed preservation failure' WHERE id = 9"])
    }
    // Shared preservation always precedes functional fixture/routine mutations.
    prove(target, 'shared-verify', [dispatcher], variables + [opal_phase:'verify'])
    if (custom.verify) { prove(target, 'custom-verify', [custom.verify], variables + [opal_phase:'verify']) }
    prove(target, 'owner-verify', [scenario.owner], variables + [opal_phase:'fresh'])
    def repeat = nativeFlyway(target, 'migrate', candidate.version)
    if (repeat.migrationsExecuted != 0) { throw new GradleException('Native repeat migrate did not report zero applied migrations') }
    nativeFlyway(target, 'validate', candidate.version)
    framework(target, 'repeat', current, variables)
  } catch (Throwable problem) { primary = problem }
  finally {
    // Attempt both observation cleanups after a primary error, retaining each
    // diagnostic. Container/volume cleanup remains independently mandatory.
    if (preparationAttempted) {
      try { prove(target, 'shared-cleanup', [dispatcher], variables + [opal_phase:'cleanup']) }
      catch (Throwable cleanup) { if (primary == null) { primary = cleanup } else { primary.addSuppressed(cleanup) } }
    }
    if (historyCaptured) {
      try { framework(target, 'cleanup', current, variables) }
      catch (Throwable cleanup) { if (primary == null) { primary = cleanup } else { primary.addSuppressed(cleanup) } }
    }
  }
  if (primary != null) { throw primary }
}
def runUpgrade = { Map target, List entries, Map scenario, String testCase ->
  if (scenario.contract != null) { runContractUpgrade(target, entries, scenario, testCase); return }
  int index = entries.findIndexOf { it.path == scenario.candidate }
  if (index <= 0) { throw new GradleException('Applicable upgrade requires a real predecessor') }
  def candidate = entries[index]
  def predecessor = entries[index - 1]
  def prior = entries.take(index)
  def current = entries.take(index + 1)
  def variables = [opal_scenario_id: scenario.id, opal_candidate_version: candidate.version,
    opal_predecessor_version: predecessor.version]
  if (testCase != null) { variables.opal_test_case = testCase }
  target.evidence.add("Scenario ${scenario.id}; candidate ${candidate.path} (${candidate.version}); predecessor ${predecessor.path} (${predecessor.version})")
  target.declared = ["flyway-migrate-${predecessor.version}", "flyway-validate-${predecessor.version}",
    'framework-predecessor', 'owner-prepare', "flyway-migrate-${candidate.version}",
    "flyway-validate-${candidate.version}", 'framework-candidate', 'owner-verify',
    'framework-repeat', 'owner-cleanup', 'framework-cleanup']
  crossCheckNative(target, entries)
  nativeFlyway(target, 'migrate', predecessor.version)
  nativeFlyway(target, 'validate', predecessor.version)
  framework(target, 'predecessor', prior, variables)
  prove(target, 'owner-prepare', [scenario.owner], variables + [opal_phase: 'prepare'])
  if (testCase == 'retry') {
    def candidateBefore = digest(new File(fixtureRoot, candidate.path))
    try {
      nativeFlyway(target, 'migrate', candidate.version)
      throw new GradleException('Expected controlled candidate failure did not occur')
    } catch (GradleException failure) {
      if (!failure.message.contains('fixed framework candidate gate is closed')) { throw failure }
      target.evidence.add('Controlled candidate failure retained; verification Not run before cause resolution')
    }
    prove(target, 'owner-resolve', [scenario.owner], variables + [opal_phase: 'prepare', opal_test_case: 'resolve'])
    framework(target, 'repeat', prior, variables)
    if (digest(new File(fixtureRoot, candidate.path)) != candidateBefore) { throw new GradleException('Retry changed candidate bytes') }
    target.evidence.add('Retry candidate SHA-256 unchanged: ' + candidateBefore)
  }
  if (testCase == 'failed-history') { framework(target, 'fresh', prior, variables) }
  nativeFlyway(target, 'migrate', candidate.version)
  nativeFlyway(target, 'validate', candidate.version)
  framework(target, 'candidate', current, variables)
  prove(target, 'owner-verify', [scenario.owner], variables + [opal_phase: 'verify'])
  def repeat = nativeFlyway(target, 'migrate', candidate.version)
  if (repeat.migrationsExecuted != 0) { throw new GradleException('Native repeat migrate did not report zero applied migrations') }
  nativeFlyway(target, 'validate', candidate.version)
  framework(target, 'repeat', current, variables)
  prove(target, 'owner-cleanup', [scenario.owner], variables + [opal_phase: 'cleanup'])
  framework(target, 'cleanup', current, variables)
}
def runRegisteredScenario = { Map run, List entries, Map scenario, File root, List locations, String testCase ->
  if (entries.first().path == scenario.candidate) {
    if (run.statuses.fresh != 'PASS') { throw new GradleException('Initial migration N/A requires completed fresh evidence') }
    run.statuses[scenario.id] = 'Not applicable — initial migration; full fresh path PASS'
  } else {
    run.statuses[scenario.id] = 'RUNNING'
    run.attempted++
    targetLifecycle(run, "upgrades/${scenario.id}", root, locations, null) { target ->
      runUpgrade(target, entries, scenario, testCase)
    }
    run.statuses[scenario.id] = 'PASS'
    run.completed++
  }
}
def buildImage = { Map run ->
  def result = execute(['docker','build','--file',dockerfile.absolutePath,'--tag',postgresImage,rootDir.absolutePath])
  new File(run.directory, 'image-build.log').text = result.stdout + result.stderr
  if (result.exitCode != 0) { throw new GradleException('Building pgTAP image failed; see image-build.log') }
}

project.ext.dbUpgradeFrameworkTestsRequired = false
tasks.register('dbUnitTest') {
  description = 'Runs fresh and registered predecessor SQL contracts in disposable PostgreSQL'
  group = 'Verification'
  inputs.files(dockerfile, file('gradle/db-unit-test.gradle'), file('gradle/db-upgrade-selection.gradle'),
    file('gradle/db-upgrade-contract.gradle'))
    .withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.files(fileTree(migrationRoot), fileTree(sqlRoot)).withPathSensitivity(PathSensitivity.RELATIVE)
  outputs.dir(layout.buildDirectory.dir('reports/dbUnitTest'))
  outputs.upToDateWhen { false }
  doLast {
    def run = newRun('complete fresh plus selected registered upgrades')
    Throwable failure = null
    try {
      refuseExternal(System.getenv())
      def suites = sqlFiles.files.sort { it.path }
      if (suites.isEmpty()) { throw new GradleException('No pgTAP suites discovered') }
      def entries = inventory(migrationRoot, selectedLocations)
      def allScenarios = registrations(suites, entries)
      validateAdoption(entries, allScenarios, adoptedMigrations)
      def diagnostic = providers.gradleProperty('dbUnitTestUpgradeSuite').orNull
      def eligible = validateOptions(diagnostic,
        gradle.taskGraph.allTasks.any { it.name in ['check', 'build'] }, allScenarios)
      def selection = project.ext.selectDbUpgradeScenarios(allScenarios, rootDir, [
        comparisonRef:providers.gradleProperty('dbUnitTestComparisonRef').orNull,
        mode:providers.gradleProperty('dbUnitTestUpgradeMode').orElse('affected').get(),
        selectedLocations:selectedLocations, environment:System.getenv()])
      project.ext.dbUpgradeFrameworkTestsRequired = selection.frameworkTestsRequired
      project.ext.dbUpgradeSupportFiles(rootDir)
      // Declared inputs may be outside the SQL/migration trees. Preserve the
      // actual tested bytes, including dirty files, rather than only Git status.
      def declaredInputs = allScenarios.collectMany {
        project.ext.validateDbUpgradeInputs(it, rootDir)
      }.unique().sort()
      def declaredEvidence = declaredInputs.collect { path ->
        def source = new File(rootDir, path)
        [path:path, status:source.isFile() ? 'present' : 'absent tracked dependency',
          sha256:source.isFile() ? digest(source) : null]
      }
      new File(run.directory, 'declared-inputs.json').text = JsonOutput.prettyPrint(JsonOutput.toJson(declaredEvidence)) + '\n'
      def fingerprints = new File(run.directory, 'source-sha256.txt')
      fingerprints.text = (fingerprints.readLines() + declaredEvidence.findAll { it.sha256 }.collect {
        "${it.path} ${it.sha256}".toString()
      }).unique().sort().join('\n') + '\n'
      run.evidence.add('Declared dependency bytes and tracked absences: declared-inputs.json; source-sha256.txt')
      // The manual one-owner diagnostic deliberately chooses its owner even with no Git impact.
      def scenarios = diagnostic == null ? selection.selected : eligible
      run.discovered = allScenarios.size()
      run.scheduled = scenarios.size()
      run.evidence.add("Selected locations: ${selectedLocations}; discovered ${allScenarios.size()}; selected ${scenarios.size()}")
      run.evidence.add("Upgrade selection mode: ${diagnostic == null ? selection.mode : 'diagnostic'}; context: ${selection.context}")
      run.evidence.add("Comparison ref: ${selection.comparisonRef}; base SHA: ${selection.baseSha}; merge base SHA: ${selection.mergeBaseSha}; tested source SHA: ${selection.testedSourceSha}")
      run.evidence.add("Comparison boundary: ${selection.boundary}; fallback: ${selection.fallbackReason ?: 'none'}")
      run.evidence.add("Changed paths: ${selection.changedPaths}")
      run.evidence.add("Migration history validation: ${JsonOutput.toJson(selection.historyValidation)}")
      run.evidence.add("Native framework regressions required: ${selection.frameworkTestsRequired}")
      selection.unverifiedMigrations.each { migration ->
        run.evidence.add("Unverified migration: ${migration.path} (${migration.version}); ${migration.reason}")
      }
      run.statuses.fresh = 'Not run'
      allScenarios.each { scenario ->
        boolean selected = scenarios.any { it.id == scenario.id }
        run.statuses[scenario.id] = selected ? 'Not run' : diagnostic == null ? 'Not selected — unchanged' : 'Not selected — manual owner diagnostic'
        run.evidence.add("Selection ${scenario.id}: ${diagnostic == null ? selection.reasons[scenario.id] : selected ? 'Selected — manual owner diagnostic' : 'Not selected — manual owner diagnostic'}")
      }
      buildImage(run)
      run.statuses.fresh = 'RUNNING'
      targetLifecycle(run, 'fresh', migrationRoot, selectedLocations, null) { target ->
        crossCheckNative(target, entries)
        nativeFlyway(target, 'migrate', null)
        nativeFlyway(target, 'validate', null)
        def vars = [opal_scenario_id: 'fresh', opal_phase: 'fresh']
        framework(target, 'snapshot', entries, vars)
        def repeat = nativeFlyway(target, 'migrate', null)
        if (repeat.migrationsExecuted != 0) { throw new GradleException('Fresh repeat did not report zero applied migrations') }
        nativeFlyway(target, 'validate', null)
        framework(target, 'repeat', entries, vars)
        def fixture = command(target, 'known-failure', ['docker','exec',target.name,'pg_prove','--verbose','-h','localhost',
          '-U','postgres','-d',databaseName,'--set','ON_ERROR_STOP=1','/tmp/opal-db-unit-test/framework/failing_pgtap_test.sql'])
        new File(run.base, 'framework-self-test.log').text = fixture.stdout + fixture.stderr
        if (fixture.exitCode == 0 || !fixture.stdout.contains('deliberate pgTAP failure used to verify the database unit-test framework')) {
          throw new GradleException('Known failing pgTAP fixture did not fail with its expected diagnostic')
        }
        def result = prove(target, 'fresh-suites', suites, vars + [opal_framework_phase: 'fresh', opal_expected_history: expectedHistory(entries)])
        new File(run.base, 'pg-prove.log').text = result.stdout + result.stderr
        framework(target, 'cleanup', entries, vars)
      }
      run.statuses.fresh = 'PASS'
      scenarios.each { scenario ->
        runRegisteredScenario(run, entries, scenario, migrationRoot, selectedLocations, null)
      }
    } catch (Throwable problem) {
      failure = problem
    }
    finally { finishRun(run, failure) }
    if (failure != null) { throw failure }
  }
}

tasks.register('dbUnitTestFrameworkTest') {

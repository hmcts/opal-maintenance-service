        'shared-primary-plus-cleanup']
      sharedCases.each { run.statuses[it] = 'Not run' }
      sharedCases.each { name ->
        run.statuses[name] = 'RUNNING'
        boolean customCase = name in ['contract-custom-good','contract-custom-prepare-error']
        String injection = name in ['contract-cleanup-error','shared-primary-plus-cleanup'] ? 'shared-cleanup' : null
        String testCase = name == 'shared-primary-plus-cleanup' ? 'contract-future-dependency' : name
        def action = {
          try {
            targetLifecycle(run, "framework-self-tests/${name}", fixtureRoot, ['ddl','data'], injection) { target ->
              runUpgrade(target, entries, customCase ? customScenario : sharedScenario, testCase)
            }
          } catch (GradleException primary) {
            if (name == 'shared-primary-plus-cleanup' && (primary.suppressed.size() != 1 ||
                !primary.suppressed[0].message.contains('shared-cleanup pg_prove failed'))) {
              throw new GradleException('Shared SQL cleanup failure did not remain secondary to the owner failure')
            }
            throw primary
          }
        }
        if (name in ['contract-good','contract-custom-good']) { action() }
        else {
          def diagnostic = name == 'contract-custom-prepare-error' ? 'custom-prepare pg_prove failed' :
            name == 'contract-cleanup-error' ? 'shared-cleanup pg_prove failed' :
            name == 'contract-preservation-failure' ? 'shared-verify pg_prove failed' : 'owner-verify pg_prove failed'
          expectFailure(name, diagnostic, action)
          def logs = fileTree(new File(run.directory, "framework-self-tests/${name}")) { include '*.log' }
            .files.collect { it.text }.join('\n')
          def marker = name == 'contract-custom-prepare-error' ? 'fixed shared custom preparation failure' :
            name == 'contract-cleanup-error' ? 'fixed framework command failure: shared-cleanup' :
            name == 'contract-preservation-failure' ? 'not ok 2 - all declared predecessor row text preserved' :
            'relation "public.framework_future_only" does not exist'
          if (!logs.contains(marker)) { throw new GradleException("Shared regression ${name} lost its intended SQL diagnostic") }
          if (name == 'shared-primary-plus-cleanup' &&
              !new File(run.directory, "framework-self-tests/${name}/summary.txt").text.contains('Secondary failure: shared-cleanup')) {
            throw new GradleException('Shared primary and SQL cleanup evidence was not retained')
          }
        }
        run.statuses[name] = 'PASS (shared regression expectation and actual target absence)'
      }
      def cases = ['good','retry','migration-failure','temp','rollback','mutation','failed-history'] +
        ['prepare','verify','cleanup'].collectMany { phase -> ['sql','tap','zero','plan'].collect { "${it}-${phase}" } }
      cases.each { run.statuses[it] = 'Not run' }
      cases.each { name ->
        run.statuses[name] = 'RUNNING'
        def action = {
          targetLifecycle(run, "framework-self-tests/${name}", fixtureRoot, ['ddl','data'], null) { target ->
            runUpgrade(target, entries, scenario, name)
          }
        }
        if (name in ['good','retry']) { action() }
        else {
          def diagnostic = name == 'migration-failure' ? 'fixed framework candidate gate is closed' : 'pg_prove failed'
          expectFailure(name, diagnostic, action)
          def marker = name.startsWith('sql-') ? 'ERROR:  fixed hard SQL error after passing assertions' :
            name.startsWith('tap-') ? 'fixed failing phase assertion' :
            name.startsWith('zero-') ? 'fixed zero-plan regression' :
            name.startsWith('plan-') ? 'You planned 99 tests but ran' :
            name in ['temp','rollback'] ? 'relation "opal_framework_owner_state.observation" does not exist' :
            name == 'mutation' ? 'not ok 2 - Named application rows preserved' :
            name == 'failed-history' ? 'not ok 2 - Every selected migration succeeded' :
            'fixed framework candidate gate is closed'
          def phaseLogs = fileTree(new File(run.directory, "framework-self-tests/${name}")) {
            include '*.log'
          }.files.collect { it.text }.join('\n')
          if (!phaseLogs.contains(marker)) { throw new GradleException("Regression ${name} failed without its intended diagnostic") }
          if (name.startsWith('zero-')) {
            def zeroPhase = name.substring('zero-'.length())
            def zeroLog = fileTree(new File(run.directory, "framework-self-tests/${name}")) {
              include "*-owner-${zeroPhase}.log"
            }.singleFile.text
            if (!zeroLog.contains('\nExit: 0;') || !zeroLog.contains('Tests=0')) {
              throw new GradleException("Regression ${name} did not produce native successful zero-test TAP")
            }
            run.evidence.add("Regression ${name}: native pg_prove exit 0 with zero tests rejected by positive-plan guard")
          }
          run.evidence.add("Regression ${name}: intended command diagnostic retained")
        }
        run.statuses[name] = 'PASS (regression expectation and actual target absence)'
      }
      // A nested run exercises the same summary finalization after early discovery
      // and a later scenario failure without overwriting any completed target report.
      def earlyRun = newRun('framework expected early discovery failure')
      earlyRun.statuses.pending = 'Not run'
      Throwable earlyFailure = null
      try { inventory(fixtureRoot, ['absent-fixed-location']) }
      catch (GradleException expected) { earlyFailure = expected }
      finishRun(earlyRun, earlyFailure)
      if (earlyFailure == null || !new File(earlyRun.directory, 'summary.txt').text.contains('Not run — earlier failure')) {
        throw new GradleException('Early failure summary was not retained')
      }
      def scheduledRun = newRun('framework expected later scenario failure')
      scheduledRun.statuses.fresh = 'PASS'
      [scenario.id,'failing','pending'].each { scheduledRun.statuses[it] = 'Not run' }
      Throwable scenarioFailure = null
      try {
        // Retain the owner's exact registered tuple; reporting labels belong to
        // targets/statuses and must never replace the identity supplied to SQL.
        runRegisteredScenario(scheduledRun, entries, scenario, fixtureRoot, ['ddl','data'], 'good')
        scheduledRun.statuses.failing = 'RUNNING'
        scheduledRun.attempted++
        targetLifecycle(scheduledRun, 'upgrades/failing', fixtureRoot, ['ddl','data'], null) { target ->
          runUpgrade(target, entries, scenario, 'sql-prepare')
        }
        scheduledRun.statuses.failing = 'PASS'
        scheduledRun.completed++
      } catch (GradleException expected) { scenarioFailure = expected }
      finishRun(scheduledRun, scenarioFailure)
      def scheduledSummary = new File(scheduledRun.directory, 'summary.txt').text
      if (scenarioFailure == null || !scheduledSummary.contains("Scenario ${scenario.id}: PASS")
        || !scheduledSummary.contains('Scenario failing: FAILED') || !scheduledSummary.contains('Scenario pending: Not run')
        || !new File(scheduledRun.directory, "upgrades/${scenario.id}/summary.txt").isFile()
        || new File(scheduledRun.directory, 'upgrades/pending').exists()) {
        throw new GradleException('Failed run lost completed evidence or unexecuted scenario status')
      }
      run.evidence.add("Early failure report: ${earlyRun.directory.name}; later failure report: ${scheduledRun.directory.name}")
      ['readiness','flyway-info-latest','remove','absence','volume-absence'].each { injection ->
        expectFailure(injection, injection == 'readiness' ? 'readiness failed' : "${injection} failed", {
          targetLifecycle(run, "framework-self-tests/${injection}", fixtureRoot, ['ddl','data'], injection) { target ->
            crossCheckNative(target, entries)
          }
        })
      }
      expectFailure('primary-plus-cleanup', 'owner-prepare pg_prove failed', {
        try {
          targetLifecycle(run, 'framework-self-tests/dual-failure', fixtureRoot, ['ddl','data'], 'remove') { target ->
            runUpgrade(target, entries, scenario, 'sql-prepare')
          }
        } catch (GradleException primary) {
          if (primary.suppressed.size() != 1 || !primary.suppressed[0].message.contains('remove failed')) {
            throw new GradleException('Cleanup diagnostic did not remain suppressed on primary failure')
          }
          throw primary
        }
      })
    } catch (Throwable problem) {
      failure = problem
    }
    finally {
      finishRun(run, failure)
      new File(run.base, 'framework-self-test.log').text = "Framework regression run: ${run.directory.name}\n" + new File(run.directory, 'summary.txt').text
    }
    if (failure != null) { throw failure }
  }
}

tasks.named('dbUnitTest') { finalizedBy tasks.named('dbUnitTestFrameworkTest') }
tasks.named('check') {
  dependsOn tasks.named('dbUnitTest'), tasks.named('dbUnitTestSelectionTest'),
    tasks.named('dbUnitTestContractTest'), tasks.named('dbUnitTestFrameworkTest')
}

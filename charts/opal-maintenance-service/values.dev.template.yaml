global:
  postgresUsername: "javapostgres"
  postgresPassword: "javapassword"
  postgresOptions: "?stringtype=unspecified"

java:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  devmemoryRequests: "1Gi"
  devcpuRequests: "250m"
  devmemoryLimits: "2Gi"
  devcpuLimits: "2500m"
  keyVaults:
    opal:
      secrets:
        - name: app-insights-connection-string
          alias: app-insights-connection-string
        - name: AzureADTenantId
          alias: AAD_TENANT_ID
        - name: AzureADClientId
          alias: AAD_CLIENT_ID
        - name: AzureADClientSecret
          alias: AAD_CLIENT_SECRET
        - name: servicebus-connection-string
          alias: SERVICEBUS_CONNECTION_STRING
        - name: servicebus-logging-pdpl-queue-name
          alias: SERVICEBUS_LOGGING_PDPL_QUEUE_NAME
        - name: managed-redis-connection-string
          alias: REDIS_CONNECTION_STRING
  environment:
    OPAL_MAINTENANCE_DB_HOST: "{{ .Release.Name }}-postgresql"
    OPAL_MAINTENANCE_DB_NAME: "{{ .Values.postgresql.auth.database}}"
    OPAL_MAINTENANCE_DB_USERNAME: "{{ .Values.postgresql.auth.username}}"
    OPAL_MAINTENANCE_DB_PASSWORD: "{{ .Values.postgresql.auth.password}}"
    OPAL_MAINTENANCE_DB_OPTIONS: "?stringtype=unspecified"
    OPAL_MAINTENANCE_DB_PORT: 5432
    RUN_DB_MIGRATION_ON_STARTUP: true
    FLYWAY_LOCATIONS: classpath:db/migration/ddl, classpath:db/migration/data/allEnvs, classpath:db/migration/data/nle, classpath:db/migration/data/dev
    TESTING_SUPPORT_ENDPOINTS_ENABLED: false
    OPAL_REDIS_ENABLED: false
    OPAL_USER_SERVICE_API_URL: "${OPAL_USER_SERVICE_API_URL}"
    SERVICEBUS_LOGGING_PDPL_PROTOCOL: amqps
  postgresql:
    enabled: true
    primary:
      initdb:
        scripts:
          init.sql: |-
            CREATE DATABASE "opal-user-db" OWNER javapostgres ENCODING = 'UTF-8' CONNECTION LIMIT = -1;
    auth:
      username: javapostgres
      password: javapassword
      database: opal-maintenance-db

opal-user-service:
  enabled: ${DEV_ENABLE_OPAL_USER_SERVICE}
  java:
    releaseNameOverride: '{{ .Release.Name }}-user-service'
    image: 'hmctsprod.azurecr.io/opal/user-service:${DEV_OPAL_USER_SERVICE_IMAGE_SUFFIX}'
    ingressHost: "opal-maintenance-service-pr-${CHANGE_ID}-user-service.dev.platform.hmcts.net"
    keyVaults:
      opal:
        secrets:
          - name: app-insights-connection-string
            alias: app-insights-connection-string
          - name: launch-darkly-sdk-key
            alias: LAUNCH_DARKLY_SDK_KEY
          - name: AzureADTenantId
            alias: AAD_TENANT_ID
          - name: AzureADClientId
            alias: AAD_CLIENT_ID
          - name: AzureADClientSecret
            alias: AAD_CLIENT_SECRET
          - name: OpalTestUserPassword
            alias: OPAL_TEST_USER_PASSWORD
    environment:
      OPAL_USER_DB_HOST: "{{ .Release.Name }}-postgresql"
      OPAL_USER_DB_NAME: "opal-user-db"
      OPAL_USER_DB_USERNAME: "{{ .Values.global.postgresUsername }}"
      OPAL_USER_DB_PASSWORD: "{{ .Values.global.postgresPassword }}"
      OPAL_USER_DB_OPTIONS: "{{ .Values.global.postgresOptions }}"
      OPAL_USER_DB_PORT: 5432
      RUN_DB_MIGRATION_ON_STARTUP: true
      OPAL_FRONTEND_URL: https://opal-frontend.staging.apps.hmcts.net
      TESTING_SUPPORT_ENDPOINTS_ENABLED: true
      LAUNCH_DARKLY_ENABLED: false
      FLYWAY_LOCATIONS: classpath:db/migration/ddl, classpath:db/migration/data/allEnvs, classpath:db/migration/data/nle, classpath:db/migration/data/dev
      APPLICATIONINSIGHTS_ROLE_NAME: "opal-maintenance-service-pr-${CHANGE_ID}-user-service"
      RELEASE_1A_ENABLED: true
    postgresql:
      enabled: false
  user-role-mapping-refresh:
    enabled: false

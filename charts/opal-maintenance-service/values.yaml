java:
  applicationPort: 4551
  image: 'hmctsprod.azurecr.io/opal/maintenance-service:latest'
  ingressHost: opal-maintenance-service.{{ .Values.global.environment }}.platform.hmcts.net
  keyVaults:
    opal:
      secrets:
        - name: app-insights-connection-string
          alias: app-insights-connection-string
        - name: launch-darkly-sdk-key
          alias: LAUNCH_DARKLY_SDK_KEY
        - name: maintenance-service-POSTGRES-HOST
          alias: OPAL_MAINTENANCE_DB_HOST
        - name: maintenance-service-POSTGRES-PASS
          alias: OPAL_MAINTENANCE_DB_PASSWORD
        - name: maintenance-service-POSTGRES-PORT
          alias: OPAL_MAINTENANCE_DB_PORT
        - name: maintenance-service-POSTGRES-USER
          alias: OPAL_MAINTENANCE_DB_USERNAME
        - name: maintenance-service-POSTGRES-DATABASE
          alias: OPAL_MAINTENANCE_DB_NAME
        - name: AzureADTenantId
          alias: AAD_TENANT_ID
        - name: AzureADClientId
          alias: AAD_CLIENT_ID
        - name: AzureADClientSecret
          alias: AAD_CLIENT_SECRET
        - name: OpalTestUserPassword
          alias: OPAL_TEST_USER_PASSWORD
        - name: servicebus-connection-string
          alias: SERVICEBUS_CONNECTION_STRING
        - name: servicebus-shared-access-key
          alias: SERVICEBUS_SHARED_ACCESS_KEY
        - name: servicebus-logging-pdpl-queue-name
          alias: SERVICEBUS_LOGGING_PDPL_QUEUE_NAME
        - name: managed-redis-connection-string
          alias: REDIS_CONNECTION_STRING
  environment:
    RUN_DB_MIGRATION_ON_STARTUP: true
    OPAL_RM_FRONTEND_URL: https://opal-rm-frontend.{{ .Values.global.environment }}.apps.hmcts.net
    TESTING_SUPPORT_ENDPOINTS_ENABLED: true
    LAUNCH_DARKLY_ENABLED: true
    OPAL_REDIS_ENABLED: true
    OPAL_USER_SERVICE_API_URL: https://opal-user-service.{{ .Values.global.environment }}.platform.hmcts.net
    FLYWAY_LOCATIONS: classpath:db/migration/ddl,classpath:db/migration/data/allEnvs
    SERVICEBUS_LOGGING_PDPL_PROTOCOL: amqps
    SERVICEBUS_PROTOCOL: amqps
  postgresql:
    enabled: false
    image:
      tag: '17.5.0'
opal-rm-frontend:
  enabled: false
opal-user-service:
  enabled: false
opal-logging-service:
  enabled: false
servicebus:
  enabled: false
redis:
  image:
    registry: hmctsprod.azurecr.io
    repository: imported/bitnami/redis
  enabled: false
global:
  security:
    allowInsecureImages: true

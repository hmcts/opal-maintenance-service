services:
  opal-maintenance-service:
    container_name: opal-maintenance-service
    build:
      context: .
      args:
        - http_proxy
        - https_proxy
        - no_proxy
    environment:
      # these environment variables are used by java-logging library
      - ROOT_APPENDER
      - LOGBACK_REQUIRE_THREAD
      - LOGBACK_REQUIRE_ALERT_LEVEL=false
      - LOGBACK_REQUIRE_ERROR_CODE=false
      - OPAL_MAINTENANCE_DB_HOST=opal-maintenance-db
      - OPAL_LEGACY_GATEWAY_URL=http://host.docker.internal:4553/opal
      - OPAL_USER_SERVICE_API_URL=http://host.docker.internal:4555/
      - TESTING_SUPPORT_ENDPOINTS_ENABLED=true
      - OPAL_REDIS_ENABLED=false

    ports:
      - "4551:4551"
    depends_on:
      - redis

  opal-maintenance-db:
    container_name: opal-maintenance-db
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=opal-maintenance-db
      - POSTGRES_USER=opal-maintenance
      - POSTGRES_PASSWORD=opal-maintenance
    ports:
      - "5432:5432"
    volumes:
      - opal-database-data:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  opal-database-data:
  redis-data:

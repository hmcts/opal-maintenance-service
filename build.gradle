import org.gradle.api.tasks.PathSensitivity
import org.flywaydb.gradle.task.FlywayMigrateTask
import java.util.concurrent.TimeUnit
import groovy.io.FileType

buildscript {
  dependencies {
    classpath("org.flywaydb:flyway-database-postgresql:13.3.0")
  }
}

plugins {
  id 'application'
  id 'jacoco'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.github.ben-manes.versions' version '0.61.0'
  id 'org.sonarqube' version '7.4.0.8496'
  id 'uk.gov.hmcts.java' version '0.12.70'
  id 'org.flywaydb.flyway' version '13.3.0'
  id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.9'
  id "org.openapi.generator" version "7.24.0"
}

ext {
  log4JVersion = "2.26.1"
  cucumberVersion = "7.23.0"
  serenityVersion = "5.3.11"
}

def ciEnvironmentVariables = ['CI', 'GITHUB_ACTIONS', 'JENKINS_HOME', 'BUILD_ID']

def isLocalIntegrationEnvironment = {
  ciEnvironmentVariables.every { !System.getenv(it) }
}

def isPortAvailable = { int port ->
  try {
    def socket = new ServerSocket(port)
    socket.reuseAddress = true
    socket.close()
    true
  } catch (Exception ignored) {
    false
  }
}

group = 'uk.gov.hmcts'
version = '0.0.1'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

sourceSets {
  openapi {
    java {
      srcDirs = [file('src/openApi/java')]
    }
    resources.srcDirs = [file('src/openApi/resources')]
  }
  main {
    java {
      srcDir "$buildDir/generated/openapi/src/main/java"
    }
  }

  functionalTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/functionalTest/java')
    }
    resources.srcDir file('src/functionalTest/resources')
  }

  integrationTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/integrationTest/java')
    }
    resources.srcDirs = [file('src/integrationTest/resources')]
  }

  smokeTest {
    java {
      compileClasspath += main.output
      runtimeClasspath += main.output
      srcDir file('src/smokeTest/java')
    }
    resources.srcDir file('src/smokeTest/resources')
  }
}

configurations {
  openapiImplementation.extendsFrom implementation
  openapiRuntimeOnly.extendsFrom runtimeOnly

  functionalTestImplementation.extendsFrom testImplementation
  functionalTestRuntimeOnly.extendsFrom runtimeOnly

  integrationTestImplementation.extendsFrom testImplementation
  integrationTestRuntimeOnly.extendsFrom runtimeOnly

  smokeTestImplementation.extendsFrom testImplementation
  smokeTestRuntimeOnly.extendsFrom runtimeOnly

  zephyrCucumberReportProcessor
}

configurations.configureEach {
  resolutionStrategy {
    force "io.cucumber:cucumber-core:${cucumberVersion}"
    force "io.cucumber:cucumber-java:${cucumberVersion}"
    force "io.cucumber:cucumber-junit:${cucumberVersion}"
  }
}

tasks.register("bundleOpenApi", JavaExec) {
  dependsOn 'compileOpenapiJava'
  classpath = sourceSets.openapi.runtimeClasspath
  group = "openapi"
  description = "Bundle multiple OpenAPI YAML files into one"
  mainClass = 'uk.gov.hmcts.opal.openapi.OpenApiBundler'
  args = ["$rootDir/src/main/resources/openapi", layout.buildDirectory.file("openapi-bundled.yaml").get().asFile.absolutePath]
}

openApiGenerate {
  generatorName = "spring"
  inputSpec = layout.buildDirectory.file("openapi-bundled.yaml").get().asFile.absolutePath
  outputDir = layout.buildDirectory.dir("generated/openapi").get().asFile.absolutePath
  apiPackage = "uk.gov.hmcts.opal.generated.".toString() + "http.api"
  modelPackage = "uk.gov.hmcts.opal.generated.".toString() + "model"
  importMappings = [
    Nullable: "org.jspecify.annotations.Nullable",
    Short: "java.lang.Short",
    BigInteger: "java.math.BigInteger"
  ]
  typeMappings = [
    "integer+int16": "short",
    "integer+bigint": "BigInteger"
  ]
  // Point to your customized mustache templates
  templateDir = "$rootDir/openapi/templates".toString()
  generateApiTests = false
  generateModelTests = false
  skipOperationExample = true
  openapiNormalizer = [
    REF_AS_PARENT_IN_ALLOF: "true"
  ]
  configOptions = [
    dateLibrary                         : "java8-localdatetime",
    interfaceOnly                       : "true",
    useTags                             : "true",
    useSpringBoot4                      : "true",
    containerDefaultToNull              : "true",
    generatedConstructorWithRequiredArgs: "false",
    useBeanValidation                   : "true",
    useLombokAnnotations                : "true",
    generateBuilders                    : "true"
  ]
}

// (Temp?) Fix to solve the issue:
// Toolchain from `executable` property does not match toolchain from `javaLauncher` property.
gradle.taskGraph.whenReady { taskGraph ->
  def task = taskGraph.allTasks.find { it.name.endsWith(".main()") }
  if (task instanceof JavaExec) {
    task.executable = task.javaLauncher.get().executablePath.asFile.absolutePath
  }
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs << "-Xlint:unchecked"
//  Enable the following to stop the build on any warning messages (not just error messages)
  options.compilerArgs << "-Werror"
//  Change the maximum number of reported compiler errors (default 100)
  options.compilerArgs.addAll("-Xmaxerrs", "200")
}

// https://github.com/gradle/gradle/issues/16791
tasks.withType(JavaExec).configureEach {
  javaLauncher.set(javaToolchains.launcherFor(java.toolchain))
}

tasks.named('sonarResolver') {
  dependsOn(processResources)
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()

  systemProperty 'spring.test.context.cache.maxSize', 4

  testLogging {
    exceptionFormat = 'full'
  }
  maxHeapSize = "2g"
  failFast = false
}

tasks.register('clearIntegrationReports', Delete) {
  delete(
    layout.buildDirectory.dir("test-results/integration"),
    layout.buildDirectory.dir("reports/tests/integration"),
    file("${rootDir}/target/zephyr-reports/Junit5Report-IntegrationTest.json"),
    file("${rootDir}/integration-output")
  )
}

tasks.register('integration', Test) {
  description = "Runs integration tests"
  group = "Verification"
  dependsOn 'clearIntegrationReports'
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  classpath = sourceSets.integrationTest.runtimeClasspath
  inputs.files(fileTree('src/dbUnitTest')).withPathSensitivity(PathSensitivity.RELATIVE)
  inputs.file('docker/postgres-pgtap.Dockerfile').withPathSensitivity(PathSensitivity.RELATIVE)
  finalizedBy 'packageIntegrationOutput'
}

tasks.register('functionalOpal', Test) {

  description = "Runs functional tests against Opal mode"
  group = "Verification"
  dependsOn 'clearFunctionalReports'
  testClassesDirs = sourceSets.functionalTest.output.classesDirs
  classpath = sourceSets.functionalTest.runtimeClasspath
  outputs.upToDateWhen { false }
  reports.junitXml.getOutputLocation().set(layout.buildDirectory.dir("test-results/functional/opal"))
  testLogging.showStandardStreams = true
  environment("IS_LEGACY_MODE", "false")
  exclude '**/OpalTestRunner.class'
  finalizedBy 'mergeFunctionalResults', 'copyFunctionalReport'
}

tasks.register('copyFunctionalReport', Copy) {
  from(layout.buildDirectory.dir("reports/tests/functionalOpal"))
  into("${rootDir}/functional-output/report")
  doLast {
    logger.quiet("Functional Test Report available at - file://${rootDir}/functional-output/report/index.html")
  }
}

tasks.register('copyIntegrationJunit5Report', Sync) {
  from("target/zephyr-reports/Junit5Report-IntegrationTest.json")
  into("${rootDir}/integration-output/zephyr")
  outputs.upToDateWhen { false }
}

tasks.named('copyIntegrationJunit5Report') {
  mustRunAfter tasks.named('integration')
}

tasks.register('packageIntegrationOutput', Sync) {
  dependsOn 'copyIntegrationJunit5Report'
  from(layout.buildDirectory.dir("reports/tests/integration"))
  into("${rootDir}/integration-output/report")
}
tasks.register('mergeFunctionalResults', Copy) {
  from layout.buildDirectory.dir("test-results/functional/opal")
  into layout.buildDirectory.dir("test-results/functional")
  include '*.xml'
}
tasks.register('clearFunctionalReports', Delete) {
  delete(
    layout.buildDirectory.dir("test-results/functional"),
    layout.buildDirectory.dir("reports/tests/functionalOpal"),
    file("${rootDir}/functional-output")
  )
}
tasks.register('functional') {
  description = "Runs functional tests"
  group = "Verification"
  dependsOn('clearFunctionalReports', 'functionalOpal', 'copyFunctionalReport', 'mergeFunctionalResults')
  tasks.functionalOpal.mustRunAfter clearFunctionalReports
  tasks.mergeFunctionalResults.mustRunAfter functionalOpal
  tasks.copyFunctionalReport.mustRunAfter functionalOpal
}

tasks.register('smokeOpal', Test) {
  description = "Runs Smoke Tests"
  group = "Verification"
  dependsOn 'clearSmokeReports'
  testClassesDirs = sourceSets.smokeTest.output.classesDirs
  classpath = sourceSets.smokeTest.runtimeClasspath
  reports.junitXml.getOutputLocation().set(layout.buildDirectory.dir("test-results/smoke"))
  testLogging.showStandardStreams = true
  outputs.upToDateWhen { false }
  finalizedBy 'packageSmokeOutput'
}
tasks.register('copySmokeReport', Copy) {
  mustRunAfter tasks.named('smokeOpal')
  from(layout.buildDirectory.dir("reports/tests/smokeOpal"))
  into("${rootDir}/smoke-test-report")
  doLast {
    logger.quiet("Smoke Test Report available at - file://${rootDir}/smoke-test-report/index.html")
  }
}
tasks.register('packageSmokeOutput', Copy) {
  dependsOn 'copySmokeReport'
  into("${rootDir}/smoke-output")
  from("${rootDir}/smoke-test-report") {
    into("report")
  }
}
tasks.register('clearSmokeReports', Delete) {
  delete(
    layout.buildDirectory.dir("test-results/smoke"),
    layout.buildDirectory.dir("reports/tests/smokeOpal"),
    file("${rootDir}/smoke-test-report"),
    file("${rootDir}/smoke-output")
  )
}

tasks.register('smoke') {
  description = "Runs Smoke Tests"
  group = "Verification"
  dependsOn('clearSmokeReports', 'smokeOpal', 'aggregate', 'copySmokeReport')
  tasks.smokeOpal.mustRunAfter clearSmokeReports
  tasks.aggregate.mustRunAfter smokeOpal
  tasks.copySmokeReport.mustRunAfter aggregate
  finalizedBy 'packageSmokeOutput'

}

tasks.named('aggregate') {
  testRoot = layout.buildDirectory.dir("test-results").get().asFile.absolutePath
  mustRunAfter(
    tasks.named('smokeOpal'),
  )
}

tasks.configureEach {
  if (name in ['copyFunctionalReport', 'copySmokeReport']) {
    mustRunAfter tasks.named('aggregate')
  }
}

def coverageExclusions = [
  '**/uk/gov/hmcts/opal/**/model/**',
  '**/uk/gov/hmcts/opal/**/config/**',
  '**/uk/gov/hmcts/opal/authentication/client/**',
  '**/uk/gov/hmcts/opal/**/exception/**',
]

jacocoTestReport {
  executionData(test, integration)
  reports {
    xml.required = true
    html.required = true
    csv.required = false
    html.outputLocation.set(layout.buildDirectory.dir("jacocoHtml"))
  }
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: jacocoExclusionArray(coverageExclusions)
      )
    }))
  }
}

static String[] jacocoExclusionArray(ArrayList<String> exclusions) {
  final def lst = new ArrayList<String>()

  exclusions.stream().forEach { it.endsWith(".java") ? lst.add(it.replace(".java", ".class")) : lst.add(it) }

  return lst.toArray()
}

tasks.named("sonarqube") {
  dependsOn(tasks.named("jacocoTestReport"))
}
tasks.named("check") {
  dependsOn(tasks.named("integration"))
}

jacocoTestReport.dependsOn check
jacocoTestCoverageVerification.dependsOn jacocoTestReport

sonarqube {
  properties {
    property "sonar.projectName", "HMCTS :: opal-maintenance-service"
    property "sonar.projectKey", "uk.gov.hmcts:opal-maintenance-service-v2"
    property "sonar.gradle.skipCompile", "true"
    property "sonar.exclusions", coverageExclusions.join(', ')
    property 'sonar.coverage.exclusions', "**/entity/**,**/model/*,**/exception/*,**/config/**,**/repository/jpa/*,**/opal/dto/*"
    property 'sonar.cpd.exclusions', "**/entity/**,**/opal/dto/**"
  }
}

// before committing a change, make sure task still works
dependencyUpdates {
  def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { qualifier -> version.toUpperCase().contains(qualifier) }
    def regex = /^[0-9,.v-]+$/
    return !stableKeyword && !(version ==~ regex)
  }
  rejectVersionIf { selection -> // <---- notice how the closure argument is named
    return isNonStable(selection.candidate.version) && !isNonStable(selection.currentVersion)
  }
}

dependencyManagement {
  imports {
    mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3'
    mavenBom "org.springframework.integration:spring-integration-bom:7.1.1"
    mavenBom "io.netty:netty-bom:4.2.17.Final"
    mavenBom "com.fasterxml.jackson:jackson-bom:2.22.2"
  }

  dependencies {
    dependency group: 'com.google.guava', name: 'guava', version: '33.7.1-jre'
  }
}

dependencyCheck {
  suppressionFile = 'config/owasp/suppressions.xml'
  def nvdApiKey = providers.gradleProperty('nvdApiKey')
    .orElse(providers.environmentVariable('NVD_API_KEY'))
    .orNull
  if (nvdApiKey) {
    nvd.apiKey = nvdApiKey
  }
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
  }
}



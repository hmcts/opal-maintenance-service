openapi: 3.1.1

info:
  description: Opal Maintenance Service - RM Casefile objects
  version: 1.0.0
  title: Opal Maintenance Service

components:
  schemas:
    Casefile:
      type: object
      additionalProperties: false
      required:
        - respondent_account
        - applicant
      properties:
        respondent_account:
          $ref: '#/components/schemas/RespondentAccount'
        applicant:
          $ref: '#/components/schemas/Applicant'
        minor_creditors:
          type: array
          description: >-
            Minor Creditors created within this Casefile and referenced by creditor_sequence from Order Terms.
            Omit the collection or supply an empty array when there are none.
          items:
            $ref: '#/components/schemas/MinorCreditor'
      description: >-
        Complete structured RM Casefile stored in draft_casefiles.casefile. Casefile Snapshot and Timeline Data are
        deliberately excluded because the backend creates and persists them separately.

    CasefileType:
      type: string
      description: RM Casefile type. DB Mapping - draft_casefiles.casefile_type
      enum:
        - REMO In
        - REMO Out
        - REMO Out (CMS)

    RespondentAccount:
      type: object
      additionalProperties: false
      required:
        - business_unit_id
        - application_code
        - casefile_type
        - respondent
        - order_details
      properties:
        business_unit_id:
          type: integer
          format: int16
          minimum: 1
          maximum: 32767
          description: Must equal the root business_unit_id. Eventual DB Mapping - respondent_accounts.business_unit_id
        application_code:
          type: string
          minLength: 1
          maxLength: 8
          description: >-
            Active Maintenance Application business code returned by Get Maintenance Applications.
            Retained in the Casefile; publication resolves maintenance_applications.application_code
            to respondent_accounts.application_id.
        originator_name:
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            Optional originating court supplied from Order Details. Eventual DB Mapping -
            respondent_accounts.originator_name
        casefile_type:
          allOf:
            - $ref: '#/components/schemas/CasefileType'
          description: Must equal the root casefile_type. Eventual DB Mapping - respondent_accounts.casefile_type
        remo_reference:
          type: string
          maxLength: 20
          description: Eventual DB Mapping - respondent_accounts.remo_reference
        central_authority_code:
          type: string
          minLength: 1
          maxLength: 4
          description: >-
            Optional Major Creditor code identifying the selected Central Authority, not its free-text reference.
            Must identify an active Major Creditor with central_authority=true in this Respondent Account's
            business_unit_id. Resolve against major_creditors using the Business Unit and major_creditor_code.
        central_authority_reference:
          type: string
          maxLength: 50
          description: Eventual DB Mapping - respondent_accounts.ca_reference
        account_comment:
          type: string
          maxLength: 250
          description: >-
            Optional Case Comment, separate from the Case Note. Retained in the Casefile and populated into
            respondent_accounts.account_comment on publication; does not create a Notes record.
        respondent:
          $ref: '#/components/schemas/Respondent'
        order_details:
          $ref: '#/components/schemas/OrderDetails'
        notes:
          $ref: '#/components/schemas/CaseNoteInput'

    CaseNoteInput:
      type: object
      additionalProperties: false
      required:
        - note_text
      properties:
        note_text:
          type: string
          minLength: 1
          maxLength: 1000
      description: >-
        Optional single Case Note supplied with the Casefile, not an array. Note type is not an input;
        it is assigned on publication. An empty object is invalid.

    Respondent:
      type: object
      additionalProperties: false
      required:
        - party_details
      properties:
        party_details:
          $ref: './CommonObjects.yaml#/components/schemas/PartyDetails'
        debtor_details:
          $ref: './CommonObjects.yaml#/components/schemas/DebtorDetails'
        third_party_details:
          $ref: './CommonObjects.yaml#/components/schemas/ThirdPartyDetails'

    Applicant:
      type: object
      additionalProperties: false
      required:
        - party_details
        - bank_account_details
      properties:
        party_details:
          $ref: './CommonObjects.yaml#/components/schemas/PartyDetails'
        third_party_details:
          $ref: './CommonObjects.yaml#/components/schemas/ThirdPartyDetails'
        bank_account_details:
          $ref: './CommonObjects.yaml#/components/schemas/BankAccount'
      allOf:
        - if:
            properties:
              party_details:
                properties:
                  organisation:
                    const: true
                required:
                  - organisation
            required:
              - party_details
          then:
            properties:
              party_details:
                properties:
                  organisation_details:
                    required:
                      - foreign_authority_reference
                required:
                  - organisation_details

    MinorCreditor:
      type: object
      additionalProperties: false
      required:
        - creditor_sequence
        - party_details
        - bank_account_details
      properties:
        creditor_sequence:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Casefile-local identifier used by Order Term creditor assignments.
        party_details:
          $ref: './CommonObjects.yaml#/components/schemas/PartyDetails'
        bank_account_details:
          $ref: './CommonObjects.yaml#/components/schemas/BankAccount'

    OrderDetails:
      type: object
      additionalProperties: false
      required:
        - date_ordered
        - date_arrears_last_updated
        - interest_flag
        - indexation
        - payment_arrangement
        - payment_period
        - order_terms
      properties:
        date_ordered:
          type: string
          format: date
          description: Eventual DB Mapping - respondent_accounts.imposed_hearing_date
        date_arrears_last_updated:
          type: string
          format: date
        interest_flag:
          type: boolean
          description: Eventual DB Mapping - respondent_accounts.interest_flag
        indexation:
          type: string
          enum:
            - RPI
            - CPI
            - Other
            - None
        payment_arrangement:
          type: string
          enum:
            - Court
            - Direct
        payment_period:
          type: string
          description: Eventual DB Mapping - respondent_accounts.payment_period
          enum:
            - Weekly
            - Fortnightly
            - Monthly
            - Quarterly
            - Yearly
        order_terms:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderTerm'

    OrderTerm:
      type: object
      additionalProperties: false
      description: >-
        Creditor selection is required only when the selected Result has requires_creditor=true.
        The service validates this against Result metadata;
        the static schema cannot determine it from result_id. When no creditor is required, omit creditor fields.
      required:
        - result_id
        - result_responses
      properties:
        result_id:
          type: string
          minLength: 1
          maxLength: 6
          description: Active Order Term Result. DB Mapping - results.result_id
        creditor_type:
          type: string
          description: Required by business validation when the selected Result requires a creditor.
          enum:
            - Applicant
            - Minor Creditor
            - Major Creditor
        minor_creditor_sequence:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Required when creditor_type is Minor Creditor; identifies creditor_sequence within this Casefile.
        major_creditor_code:
          type: string
          minLength: 1
          maxLength: 4
          description: >-
            Required when creditor_type is Major Creditor. Must identify an active Major Creditor in the
            Casefile's owning Business Unit. Publication resolves business_unit_id and major_creditor_code
            to major_creditors.major_creditor_id; the code alone is not globally unique.
        result_responses:
          type: array
          minItems: 1
          items:
            $ref: './CommonObjects.yaml#/components/schemas/ResultResponse'
      allOf:
        - if:
            properties:
              creditor_type:
                const: Minor Creditor
            required:
              - creditor_type
          then:
            required:
              - minor_creditor_sequence
        - if:
            properties:
              creditor_type:
                const: Major Creditor
            required:
              - creditor_type
          then:
            required:
              - major_creditor_code

    CasefileSnapshot:
      type: object
      additionalProperties: false
      required:
        - respondent_account
        - applicant_account
        - minor_creditor_accounts
      properties:
        respondent_account:
          $ref: '#/components/schemas/SnapshotRespondentAccount'
        applicant_account:
          $ref: '#/components/schemas/SnapshotApplicantAccount'
        minor_creditor_accounts:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotMinorCreditorAccount'
          description: Always present; empty when there are no Minor Creditors.
      description: >-
        Server-maintained display summary. Names and Minor Creditor sequences are populated before publication;
        account identifiers and numbers are null until publication. Lifecycle and submitter fields are returned
        separately on the Draft Casefile response, not duplicated here.

    SnapshotRespondentAccount:
      type: object
      additionalProperties: false
      required:
        - account_id
        - account_number
        - respondent_name
      properties:
        account_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
        account_number:
          type: [string, 'null']
        respondent_name:
          type: string
          minLength: 1
          description: Individual display name in SURNAME, Forenames format, or organisation name.

    SnapshotApplicantAccount:
      type: object
      additionalProperties: false
      required:
        - account_id
        - account_number
        - applicant_name
      properties:
        account_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
        account_number:
          type: [string, 'null']
        applicant_name:
          type: string
          minLength: 1
          description: Individual display name in SURNAME, Forenames format, or organisation name.

    SnapshotMinorCreditorAccount:
      type: object
      additionalProperties: false
      required:
        - creditor_sequence
        - account_id
        - account_number
        - name
      properties:
        creditor_sequence:
          type: integer
          format: int32
          minimum: 1
          description: Unique within the Casefile; matches the submitted Minor Creditor, not array position.
        account_id:
          type: [integer, 'null']
          format: int64
          minimum: 1
        account_number:
          type: [string, 'null']
        name:
          type: string
          minLength: 1
          description: Individual display name in SURNAME, Forenames format, or organisation name.

    TimelineEntry:
      type: object
      additionalProperties: false
      required:
        - username
        - status
        - status_date
      properties:
        username:
          type: string
          maxLength: 100
          description: Captured display name from the authenticated user's name claim, not an ID or login email.
        status:
          type: string
          enum:
            - Submitted
            - Resubmitted
            - Rejected
            - Approved
            - Deleted
        status_date:
          type: string
          format: date-time
          description: Backend-generated UTC lifecycle timestamp, ordered ascending within Timeline Data.
        reason_text:
          type: string
          maxLength: 1000

openapi: 3.1.1

servers:
  - url: http://localhost:4551/

info:
  description: Opal Maintenance Service - Country reference data
  version: v0.0.1
  title: Opal Maintenance Service

paths:
  /countries:
    get:
      tags:
        - Country
      summary: Returns Country reference data
      description: Returns the United Kingdom first, followed by the remaining Countries ordered by country name.
      operationId: getCountries
      parameters:
        - in: query
          name: active
          description: Filter Countries by active status. When omitted, this criterion is not applied. DB Mapping - countries.active
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Country reference data returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDataResponse'
        '406':
          description: Not Acceptable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/TypeMismatchProblemDetail'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'
        '503':
          description: Service unavailable
          content:
            application/problem+json:
              schema:
                $ref: './common.yaml#/components/schemas/ProblemDetail'

components:
  schemas:
    TypeMismatchProblemDetail:
      type: object
      description: RFC 9457 Problem Details response for an invalid query-parameter value.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - operation_id
        - retriable
        - reason
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the type-mismatch problem.
          example: https://hmcts.gov.uk/problems/type-mismatch
        title:
          type: string
          maxLength: 100
          description: Short summary of the problem type.
          example: Not Acceptable
        status:
          type: integer
          format: int32
          description: HTTP status code returned for the problem.
          example: 406
        detail:
          type: string
          description: Human-readable explanation of the problem.
          example: Invalid parameter value format
        instance:
          type: string
          format: uri
          description: URI identifying this occurrence of the problem.
          example: https://hmcts.gov.uk/problems/instance/4fbddd36053a46e5a241c57e23682616
        operation_id:
          type: string
          description: Application Insights operation identifier used to correlate logs.
          example: 4fbddd36053a46e5a241c57e23682616
        retriable:
          type: boolean
          description: Whether retrying the same request may succeed.
          example: false
        reason:
          type: string
          description: Framework conversion failure that caused the type-mismatch response.
          example: >-
            Method parameter 'active': Failed to convert value of type 'java.lang.String' to required type
            'java.lang.Boolean'; Invalid boolean value [not-a-boolean]
    ReferenceDataResponse:
      type: object
      additionalProperties: false
      required:
        - count
        - refData
      properties:
        count:
          type: integer
          format: int32
          minimum: 0
          description: Total number of Countries returned.
        refData:
          type: array
          description: Countries matching the supplied active-status filter.
          items:
            $ref: '#/components/schemas/ReferenceDataItem'
    ReferenceDataItem:
      type: object
      additionalProperties: false
      required:
        - country_id
        - cjs_code
        - country_name
        - date_used_from
        - active
      properties:
        country_id:
          type: integer
          format: int64
          minimum: 1
          description: Database-generated Country identifier. DB Mapping - countries.country_id
        cjs_code:
          type: integer
          format: int32
          minimum: -32768
          maximum: 32767
          description: Criminal Justice System Country code. DB Mapping - countries.cjs_code
        international_code:
          type: string
          maxLength: 3
          description: ISO 3166 Country code. DB Mapping - countries.international_code
        gov_code:
          type: string
          maxLength: 2
          description: UK Government Country code. DB Mapping - countries.gov_code
        country_name:
          type: string
          maxLength: 100
          description: Country display name. DB Mapping - countries.country_name
        demonym:
          type: string
          maxLength: 100
          description: Name for a person from the Country. DB Mapping - countries.demonym
        date_used_from:
          type: string
          format: date
          description: Start date for use. DB Mapping - countries.date_used_from
        date_used_to:
          type: string
          format: date
          description: Last date for use, when applicable. DB Mapping - countries.date_used_to
        active:
          type: boolean
          description: Whether the Country is active. DB Mapping - countries.active
